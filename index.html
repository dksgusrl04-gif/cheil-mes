<meta charset="utf-8">
<title>MCT MES — 공구 마모 관리</title>
<style>
  /* ═══════════════════════════════════════════════════════════════
     디자인 토큰 — 색·모서리·그림자를 여기서만 정한다.
     아래 규칙은 전부 이 변수를 쓰므로, 톤을 바꾸려면 이 블록만 고치면 된다.
     ═══════════════════════════════════════════════════════════════ */
  :root{
    --bg:#F7F9FB;        /* 화면 바탕 */
    --surface:#FFFFFF;   /* 카드·표 바탕 */
    --raise:#FCFDFE;     /* 살짝 띄운 곳 (표 머리글 등) */
    --line:#E7EAEE;      /* 기본 테두리 */
    --line-2:#F1F4F7;    /* 표 안쪽 가로줄처럼 더 연한 선 */
    --ink:#0F172A;       /* 본문 글자 */
    --ink-2:#334155;     /* 소제목 */
    --muted:#64748B;     /* 설명문 */
    --faint:#94A3B8;     /* 보조 표기 */
    --accent:#1B365D;    /* 짙은 파랑 — 브랜드 */
    --header:#16304F;    /* 최상단 바 — 눌러야 하는 곳이라 색을 준다 */
    --header-2:#1E3D64;  /* 상단바 위쪽 (아주 옅은 기울기) */
    --on-header:#B9CBE2; /* 상단바 위의 평상시 글자 */
    --accent-2:#2A5286;  /* 눌렀을 때 */
    --accent-soft:#EEF3FA;
    --accent-line:#C9D9EC;
    --danger:#DC2626; --danger-soft:#FEF2F2; --danger-line:#FBD5D5;
    /* 그래프 — mes_dash.js 가 이 값을 읽어 쓴다.
       여기만 바꾸면 종합 탭 그래프 색이 같이 따라온다. */
    --chart-bar:#7E9CC0;   /* 막대 (강조색을 옅게) */
    --chart-area:#E8EFF7;  /* 잔선 아래 면 */
    --chart-grid:#F1F4F7;  /* 눈금선 */
    --chart-axis:#94A3B8;  /* 축 숫자 */
    --chart-label:#64748B; /* 축 이름 */
    --warn:#D97706;   --warn-soft:#FFFBEB;   --warn-line:#FDE9C8;
    --warn-ink:#92610C;  /* 주의 배경 위의 글자 — 밝은 주황은 흰 배경에서 안 읽힌다 */
    /* 재집계 진행창 — 여기만 일부러 어둡게 둔다 (터미널 출력이라) */
    --term-bg:#0F172A; --term-ink:#CBD5E1;
    --term-ok:#4ADE80; --term-warn:#FBBF24; --term-err:#FCA5A5;
    --ok:#059669;     --ok-soft:#ECFDF5;     --ok-line:#C7F0DF;
    --r:10px;          /* 카드 모서리 */
    --r-sm:7px;        /* 입력·버튼 모서리 */
    --sh:0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.03);
    --sh-2:0 4px 12px rgba(15,23,42,.07), 0 1px 3px rgba(15,23,42,.04);
    --ring:0 0 0 3px rgba(27,54,93,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard","Apple SD Gothic Neo","맑은 고딕","Malgun Gothic",
    system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);font-size:13px;line-height:1.55;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  .hide{display:none!important}
  code{background:var(--raise);border:1px solid var(--line);padding:1px 6px;
    border-radius:5px;font-size:11.5px;
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}
  /* 숫자는 자릿수가 흔들리면 읽기 어렵다 — 고정폭으로 둔다 */
  .mono,.card .v,td,th,.gauge span,input[type=number]{
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  :focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}

  /* ── 로그인 */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 500px at 50% -10%, #EEF3FA 0%, var(--bg) 60%)}
  .lbox{background:var(--surface);padding:36px 38px;border-radius:14px;
    border:1px solid var(--line);box-shadow:var(--sh-2);width:380px}
  .lbox h1{font-size:19px;color:var(--ink);margin-bottom:5px;font-weight:650;
    letter-spacing:-.02em}
  .lbox .sub{color:var(--muted);font-size:12.5px;margin-bottom:24px}
  .lbox label{display:block;font-size:12px;color:var(--ink-2);margin:14px 0 6px;
    font-weight:550}
  .lbox input{width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:var(--r-sm);font-size:13px;background:var(--surface);color:var(--ink);
    transition:border-color .12s,box-shadow .12s}
  .lbox input:hover{border-color:#CBD5E1}
  .lbox input:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
  .lbox button{width:100%;margin-top:22px;padding:11px;background:var(--accent);color:#fff;
    border:0;border-radius:var(--r-sm);font-size:14px;font-weight:600;cursor:pointer;
    transition:background .12s}
  .lbox button:hover{background:var(--accent-2)}
  .lerr{margin-top:15px;padding:11px 13px;border-radius:var(--r-sm);
    background:var(--danger-soft);border:1px solid var(--danger-line);color:var(--danger);
    font-size:12.5px;line-height:1.65;text-align:left}
  .hint{margin-top:18px;font-size:11.5px;color:var(--faint);text-align:center}

  /* ── 레이아웃
     header · 기준바 · 경보바 · 본문 = 4행. 경보바를 빼먹으면 그 줄이 1fr 을 먹어
     화면이 통째로 밀린다. (행 구성은 그대로 두었다) */
  #app{display:grid;grid-template-columns:236px 1fr;
    grid-template-rows:auto auto auto auto 1fr;min-height:100vh}
  /* 최상단 바는 색을 준다. 여기가 화면에서 유일하게 «누르는 곳» 이 몰려 있는
     줄이라, 본문과 같은 흰 바탕이면 어디를 눌러야 할지 눈에 안 들어온다. */
  header{grid-column:1/3;color:#fff;
    background:linear-gradient(180deg,var(--header-2),var(--header));
    padding:0 22px;display:flex;align-items:center;gap:18px;height:56px;
    box-shadow:0 1px 0 rgba(15,23,42,.12)}
  header h1{font-size:14.5px;font-weight:650;letter-spacing:-.02em;color:#fff;
    display:flex;align-items:center;gap:9px;white-space:nowrap}
  /* 제목 앞에 작은 브랜드 조각 하나 — 글자를 안 건드리고 ::before 로 얹는다 */
  header h1::before{content:"P";width:24px;height:24px;border-radius:7px;
    background:#fff;color:var(--header);font-size:11px;font-weight:800;
    display:inline-grid;place-items:center;flex:none}
  nav{display:flex;gap:3px;margin-left:12px}
  nav button{background:transparent;border:0;color:var(--on-header);padding:8px 14px;
    border-radius:var(--r-sm);font:inherit;font-size:13px;cursor:pointer;
    transition:color .12s,background .12s}
  nav button:hover{color:#fff;background:rgba(255,255,255,.12)}
  nav button.on{background:#fff;color:var(--header);font-weight:650;
    box-shadow:0 1px 2px rgba(15,23,42,.18)}
  .spacer{flex:1}
  #who{font-size:12px;color:var(--on-header)}
  header .out{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
    color:#fff;padding:6px 13px;border-radius:var(--r-sm);font-size:12px;cursor:pointer;
    transition:background .12s,border-color .12s}
  header .out:hover{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.38)}
  header :focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.5)}

  /* ── 기준 선택 바 */
  #basis{grid-column:1/3;background:var(--raise);border-bottom:1px solid var(--line);
    padding:9px 22px;display:flex;align-items:center;gap:16px;row-gap:8px;flex-wrap:wrap}
  .bset{display:flex;align-items:center;gap:7px}
  .bset > span{font-size:11.5px;color:var(--muted);white-space:nowrap;font-weight:550}
  .bset select,.bset input[type=date]{padding:6px 9px;border:1px solid var(--line);
    border-radius:var(--r-sm);font:inherit;font-size:12.5px;background:var(--surface);
    color:var(--ink);cursor:pointer;transition:border-color .12s}
  .bset select:hover,.bset input[type=date]:hover{border-color:#CBD5E1}
  .bset select:focus,.bset input[type=date]:focus{outline:none;border-color:var(--accent);
    box-shadow:var(--ring)}
  /* 기준 설명. 예전에는 margin-left:auto 로 오른쪽 끝에 붙이고 두 줄로 썼다.
     그러면 «구간·기준 수명…» 과 멀찍이 떨어져 읽는 눈이 한 번 건너뛰고,
     두 줄이라 막대가 선택칸보다 높아져 아래에 빈 띠가 생겼다.
     날짜 칸 바로 옆에 한 줄로 붙인다 — 막대 높이가 선택칸에 맞는다. */
  #bnote{font-size:11.5px;color:var(--muted);line-height:1.45;
    white-space:nowrap}
  #bnote b{color:var(--accent);font-weight:650}
  /* ── 한 줄 안내 띠 ─────────────────────────────────────────
     문단으로 깔아 두던 설명을 한 줄로 줄인 자리. 자세한 것은 «?» 뒤. */
  .note{background:var(--accent-soft);border:1px solid var(--accent-line);
    border-radius:var(--r-sm);padding:9px 13px;margin:0 0 13px;font-size:12.5px;
    color:var(--ink-2);line-height:1.6;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .note.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn-ink)}
  .note.danger{background:var(--danger-soft);border-color:var(--danger-line);color:#991B1B}
  .note b{font-weight:650}
  .lnk{border:1px solid currentColor;background:transparent;color:inherit;font:inherit;
    font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;cursor:pointer}
  .lnk:hover{background:rgba(255,255,255,.55)}
  .hint{font-weight:400;font-size:11.5px;color:var(--faint);margin-left:7px}

  /* ── 「?」 부가설명 단추 ─────────────────────────────────── */
  .help{width:17px;height:17px;border-radius:50%;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);font:600 11px/1 sans-serif;
    cursor:pointer;padding:0;flex:none;transition:all .12s}
  .help:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .helpbox{position:fixed;inset:0;background:rgba(15,23,42,.36);z-index:60;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .helpbox.hide{display:none}
  .hcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-2);
    max-width:520px;width:100%;padding:22px 24px 18px}
  .hcard h4{margin:0 0 11px;font-size:15px;color:var(--ink)}
  .hcard p{margin:0 0 9px;font-size:12.5px;color:var(--ink-2);line-height:1.75}
  .hcard .act{margin-top:6px}

  /* ── 원그래프 범례(색 뜻) ──────────────────────────────── */
  .dsum{margin-top:13px;font-size:11.5px;color:var(--muted);line-height:1.6}
  .dsum b{color:var(--ink);font-weight:650}
  .dkey{display:flex;align-items:center;gap:15px;margin-top:13px;padding-top:11px;
    border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted)}
  .dkey span{display:flex;align-items:center;gap:5px}
  .dkey i{width:9px;height:9px;border-radius:2px}
  /* ── 사용량 원그래프 ────────────────────────────────────────
     조각 크기 = 돌아간 시간, 조각 색 = 마모 단계.
     크고 빨간 조각이 지금 제일 급한 공구다. */
  .donut{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:center}
  .dchart{position:relative;width:240px;height:240px}
  .dchart svg{width:100%;height:100%;display:block}
  .dslice{cursor:pointer;transition:opacity .12s,transform .12s;transform-origin:100px 100px}
  .dslice:hover,.dslice:focus{outline:none;transform:scale(1.035)}
  .dslice.dim{opacity:.34}
  .dmid{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 26px}
  .dmid b{font-size:26px;font-weight:700;color:var(--ink);line-height:1.1;letter-spacing:-.01em}
  .dmid b.lv1{color:var(--warn)} .dmid b.lv2{color:var(--danger)}
  .dmid span{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  .dmid span.sub{font-size:10.5px;color:var(--faint);margin-top:1px}
  .dlegs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px}
  .dleg{display:flex;align-items:center;gap:8px;padding:5px 8px;border:0;border-radius:6px;
    background:transparent;font:inherit;font-size:12px;color:var(--ink-2);cursor:pointer;
    text-align:left;width:100%;transition:background .1s}
  .dleg:hover,.dleg.on{background:var(--accent-soft)}
  .dleg i{width:9px;height:9px;border-radius:2px;flex:none}
  .dleg .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dleg .hr{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px}
  .dleg .we{width:46px;text-align:right;color:var(--ink);font-weight:600;
    font-variant-numeric:tabular-nums;font-size:11.5px}
  @media(max-width:900px){ .donut{grid-template-columns:1fr} .dchart{margin:0 auto} }
  .warnbar{grid-column:1/3;align-self:start;background:var(--warn-soft);
    border-bottom:1px solid var(--warn-line);color:#92610C;padding:9px 22px;font-size:12px}

  /* ── 왼쪽 목록 */
  aside{background:var(--surface);border-right:1px solid var(--line);
    padding:14px 0;overflow-y:auto}
  aside h3{font-size:10.5px;color:var(--faint);padding:0 18px;margin:16px 0 7px;
    letter-spacing:.06em;text-transform:uppercase;font-weight:650}
  aside h3:first-child{margin-top:0}
  .item{padding:9px 18px;cursor:pointer;font-size:12.5px;
    border-left:3px solid transparent;transition:background .12s}
  .item:hover{background:var(--line-2)}
  .item.on{background:var(--accent-soft);border-left-color:var(--accent);
    color:var(--accent);font-weight:650}
  .item .m{display:block;font-size:11px;color:var(--faint);font-weight:400;margin-top:2px}
  main{padding:22px 24px 56px;overflow-y:auto}
  h2{font-size:19px;margin-bottom:4px;font-weight:650;letter-spacing:-.02em}
  .desc{color:var(--muted);font-size:12.5px;margin-bottom:18px}

  /* ── 요약 카드 */
  .cards{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:13px 16px;min-width:140px;box-shadow:var(--sh);transition:border-color .12s}
  .card:hover{border-color:#D5DBE3}
  /* 누를 수 있는 카드. 커서와 테두리로만 알린다 — 값이 흔들리면 안 된다 */
  .card.click{cursor:pointer}
  .card.click:hover{border-color:var(--accent);background:var(--accent-soft)}
  .card .k{font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
  .card .v{font-size:23px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
  .card .u{font-size:12px;color:var(--faint);font-weight:500;margin-left:3px}
  .card.warn{background:var(--warn-soft);border-color:var(--warn-line)}
  .card.warn .v{color:var(--warn)}
  .card.ok{background:var(--ok-soft);border-color:var(--ok-line)}
  .card.ok .v{color:var(--ok)}
  .card.hl{background:var(--accent-soft);border-color:var(--accent-line)}
  .card.hl .v{color:var(--accent)}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:17px 19px;margin-bottom:15px;box-shadow:var(--sh)}
  .panel h4{font-size:13px;margin-bottom:13px;color:var(--ink);font-weight:650;
    letter-spacing:-.01em}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
  @media(max-width:1100px){.grid2{grid-template-columns:1fr}}

  select#tsel{width:100%;padding:9px 11px;border:1px solid var(--line);
    border-radius:var(--r-sm);font:inherit;font-size:13px;background:var(--surface);
    color:var(--ink)}
  select#tsel:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;
    padding:6px 13px;font-size:12px;cursor:pointer;display:flex;gap:7px;align-items:center;
    color:var(--ink-2);transition:background .12s,border-color .12s}
  .chip:hover{background:var(--accent-soft);border-color:var(--accent-line)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .chip .r{font-size:11px;opacity:.7}

  /* ── 게이지·막대 */
  .gauge{position:relative;height:32px;background:var(--line-2);border-radius:8px;
    overflow:hidden;margin:7px 0 14px;border:1px solid var(--line)}
  .gauge i{display:block;height:100%;background:var(--accent);border-radius:7px 0 0 7px;
    transition:width .3s ease}
  .gauge i.w{background:var(--warn)}
  .gauge i.d{background:var(--danger)}
  .gauge span{position:absolute;top:0;left:0;right:0;line-height:30px;text-align:center;
    font-weight:650;font-size:12.5px;color:var(--ink);
    text-shadow:0 1px 2px rgba(255,255,255,.9)}
  .bar{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

  /* ── 표 */
  .row{display:flex;justify-content:space-between;padding:7px 0;
    border-bottom:1px solid var(--line-2);font-size:12.5px}
  .row:last-child{border:0}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;padding:9px 10px;
    border-bottom:1px solid var(--line);background:var(--raise)}
  td{padding:9px 10px;border-bottom:1px solid var(--line-2)}
  tbody tr:last-child td{border-bottom:0}
  tr:hover td{background:#FAFBFC}
  .n{text-align:right}
  .muted{color:var(--faint)}
  tr.hot td{background:var(--danger-soft)}
  tr.hot:hover td{background:#FDE9E9}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;
    font-weight:600;line-height:1.7}
  .tag.w{background:var(--accent-soft);color:var(--accent)}
  .tag.b{background:var(--danger-soft);color:var(--danger)}
  .tag.g{background:var(--ok-soft);color:var(--ok)}
  #log{max-height:250px;overflow-y:auto;font-size:11.5px;line-height:1.85;
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}
  #log div{border-bottom:1px solid var(--line-2);padding:3px 0}
  canvas{width:100%;height:150px}
  button.act{background:var(--accent);color:#fff;border:0;padding:6px 13px;
    border-radius:var(--r-sm);font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;
    transition:background .12s}
  button.act:hover{background:var(--accent-2)}
  button.act:disabled{background:#CBD5E1;cursor:not-allowed}
  button.act.sec{background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
  button.act.sec:hover{background:var(--line-2);border-color:#CBD5E1}
  button.act.gray{background:var(--muted)}
  button.act.gray:hover{background:#4E5A68}

  /* ── 발주 모달 */
  #modal{position:fixed;inset:0;background:rgba(15,23,42,.42);display:flex;
    align-items:center;justify-content:center;z-index:100;

<script>
(function(){
  var mine = "93c08dd4f9";
  function banner(v){
    if (document.getElementById('mes-stale')) return;
    var d = document.createElement('div');
    d.id = 'mes-stale';
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;'
      + 'background:#16304F;color:#fff;padding:11px 18px;font:13px/1.5 system-ui,sans-serif;'
      + 'display:flex;gap:12px;align-items:center;box-shadow:0 -2px 10px rgba(0,0,0,.2)';
    d.innerHTML = '<b>새 버전이 올라와 있습니다.</b>'
      + '<span style="opacity:.8">브라우저가 옛 화면을 쥐고 있습니다 — '
      + 'Ctrl+Shift+R 로 새로고침해 주세요.</span>';
    var b = document.createElement('button');
    b.textContent = '지금 새로고침';
    b.style.cssText = 'margin-left:auto;background:#fff;color:#16304F;border:0;'
      + 'padding:6px 14px;border-radius:6px;font:inherit;font-weight:600;cursor:pointer';
    b.onclick = function(){ location.reload(true); };
    d.appendChild(b);
    (document.body || document.documentElement).appendChild(d);
  }
  function check(){
    fetch('version.txt?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.text() : null; })
      .then(function(v){
        if (!v) return;
        v = v.trim();
        if (!v || v === mine) return;             // 최신이다
        var tried = null;
        try { tried = sessionStorage.getItem('mes_tried'); } catch(e) {}
        if (tried === v) { banner(v); return; } // 새로고침해도 옛것이 온다 — 사람에게 넘긴다
        try { sessionStorage.setItem('mes_tried', v); } catch(e) {}
        location.reload();
      }).catch(function(){});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', check);
  else check();
})();
</script>

<script>
const $ = id => document.getElementById(id);
/* 사람이 적은 글을 화면에 넣을 때 반드시 거친다. 프로그램 이름처럼
   사용자가 직접 치는 값에 <  >  " 가 들어가면 화면이 깨지거나
   남의 태그가 실행된다. 숫자는 우리가 만든 것이라 안 거쳐도 된다. */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
/* 프로그램 이름 표시 — 화면 여러 곳에서 같은 모양으로 나와야 한다.
   이름이 있으면 이름을 앞세우고 번호는 작게, 없으면 번호만.
   «(이름 없음)» 같은 자리채움은 화면만 지저분해진다.
   한 곳에 모아 둔 이유 — 예전에 제조관리 목록만 고치고 대시보드 목록을
   빠뜨려서, 같은 프로그램이 화면마다 다르게 보였다. */
const pName = p => p && p.name
  ? `${esc(p.name)}<span class="muted" style="font-weight:400"> ${p.prog}</span>`
  : (p ? p.prog : '');
const mName = m => m && m.name
  ? `${esc(m.name)}<span class="muted" style="font-weight:400"> O${m.main}</span>`
  : (m ? 'O' + m.main : '');
let ME=null, TAB='dash', TOOLS=[], PROGS=null, BASIS=null;
let SEL={tool:null, prog:null, main:null};
let B={seg:null, life:null, week:null, anchor:null};
let ORDER_SEL = new Set();   // 발주 다중 선택

// ───────── 로그인
function lerr(m){ $('lerr').innerHTML=m; $('lerr').classList.remove('hide'); }
const FILE_MODE = location.protocol === 'file:';
const NO_SERVER = `<b>서버에 연결할 수 없습니다.</b><br>
  이 화면은 <code>mes_server_simple.py</code> 가 떠 있어야 동작합니다.<br><br>
  1) <code>mes_server_simple.py</code> · <code>mes_core.py</code> · <code>mes.html</code> ·
     <code>mes_data.json</code> 을 같은 폴더에 두고<br>
  2) <code>python mes_server_simple.py</code> 실행 후<br>
  3) 주소창에 <b>http://localhost:8080</b> 을 직접 입력하세요.<br><br>
  <span style="opacity:.7">※ mes.html 파일을 더블클릭해서 열면 동작하지 않습니다.</span>`;

async function doLogin(e){
  e.preventDefault();
  if(FILE_MODE){ lerr(NO_SERVER); return; }
  let r,j;
  try{
    r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:$('lid').value, pw:$('lpw').value})});
    j = await r.json();
  }catch(err){ lerr(NO_SERVER); return; }
  if(!r.ok){ lerr(j.error||'로그인 실패'); return; }
  ME=j.user; start();
}
async function doLogout(){ try{ await fetch('/api/logout',{method:'POST'}); }catch(e){} location.reload(); }
async function boot(){
  if(FILE_MODE){ lerr(NO_SERVER); return; }
  try{
    const j = await (await fetch('/api/me')).json();
    if(j.user){ ME=j.user; start(); }
  }catch(err){ lerr(NO_SERVER); }
}

// ───────── 기준 (구간·수명·시간·앵커)
function qs(){
  const p=new URLSearchParams();
  if(B.seg) p.set('seg',B.seg);
  if(B.life) p.set('life',B.life);
  if(B.week) p.set('week',B.week);
  if(B.anchor) p.set('anchor',B.anchor);
  return p.toString();
}
const api = p => fetch(p + (p.includes('?')?'&':'?') + qs()).then(r=>r.json());

function setBasis(){
  B.seg=$('b_seg').value; B.life=$('b_life').value;
  B.week=$('b_week').value; B.anchor=$('b_anchor').value;
  reload();
}

function fillBasisBar(b){
  BASIS=b;
  const sel=(el,items,val)=>{
    el.innerHTML=items.map(i=>`<option value="${i.v}" ${String(i.v)===String(val)?'selected':''}>${i.t}</option>`).join('');
  };
  sel($('b_seg'), b.segments.map(s=>({v:s.key,t:`${s.label} — ${s.tools}종 · ${s.hours.toFixed(1)}h`})), b.segment);
  sel($('b_life'), b.life_options.map(v=>({v,t:v+'일'})), b.life_days);
  sel($('b_week'), b.week_options.map(w=>({v:w.v,t:`${w.v}h${w.note?' — '+w.note:''}`})), b.week_hours);
  sel($('b_anchor'), b.anchor_options.map(a=>({v:a.v,t:a.label})), b.anchor);
  B.seg=b.segment; B.life=b.life_days; B.week=b.week_hours; B.anchor=b.anchor;

  // 한 줄로 쓴다. 두 줄이면 기준 막대가 선택칸보다 높아져 아래에 빈 띠가 생긴다.
  $('bnote').innerHTML =
    `기준 <b>${b.life_days}일 = 절삭 ${num(Math.round(b.life_cut_hours))}h</b> · 하루 ${b.day_hours.toFixed(2)}h` +
    ` · 관측 ${b.observed_hours}h = 기준 수명의 <b>${(100*b.observed_hours/b.life_cut_hours).toFixed(2)}%</b>`;

  const w=$('warn');
  if(b.segment==='all'){
    w.classList.remove('hide');
    w.innerHTML = `⚠ <b>구간 혼합</b> — ${b.switch}. 전후로 공구 세트가 통째로 바뀌었습니다. ` +
      `같은 공구 번호라도 다른 공구일 수 있어 이 구간의 적산값은 참고용입니다.`;
  } else w.classList.add('hide');
}

async function start(){
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('who').textContent = `${ME.name} (${ME.role==='manager'?'관리자':'작업자'})`;
  fillBasisBar(await api('/api/basis'));
  await loadReports();
  await reload();
}
async function reload(){
  TOOLS = await api('/api/tools');
  PROGS = await api('/api/programs');
  if(!TOOLS.find(t=>t.tool===SEL.tool)) SEL.tool = TOOLS[0]?.tool ?? null;
  if(!PROGS.progs.find(p=>p.prog===SEL.prog)) SEL.prog = null;
  if(!PROGS.mains.find(m=>m.main===SEL.main)) SEL.main = null;
  render();
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>goTab(b.dataset.tab));

/* 화면 안에서 다른 탭으로 건너뛸 때 쓴다. 위쪽 탭 버튼의 선택 표시도 같이
   옮겨 준다 — 이걸 빠뜨리면 내용은 바뀌었는데 탭은 그대로라 길을 잃는다. */
function goTab(name){
  TAB = name;
  document.querySelectorAll('nav button').forEach(x=>
    x.classList.toggle('on', x.dataset.tab===name));
  window.scrollTo(0,0);
  render();
}

// ───────── 유틸
const f2=v=>(v??0).toFixed(2), f3=v=>(v??0).toFixed(3), f4=v=>(v??0).toFixed(4);
const num=v=>(v??0).toLocaleString();
const lvl=w=> w>=100?'d': w>=90?'w':'';
const inten=v=> v==null?'-': v.toFixed(2)+'배';
const days=v=> v==null?'-': v>=10000? (v/365).toFixed(0)+'년' : num(Math.round(v))+'일';
const bar=(p,c)=>`<div class="bar"><i class="${c||''}" style="width:${Math.min(Math.max(p,0),100)}%"></i></div>`;
const cardHtml=(k,v,u,c)=>`<div class="card ${c||''}"><div class="k">${k}</div><div class="v">${v}<span class="u">${u||''}</span></div></div>`;
/* 카드를 눌러 그 항목만 보게 한다. .cards 가 flex 라 래퍼 div 로 감싸면
   카드가 안 늘어난다 — 그래서 카드 자체에 onclick 을 심는다. */
const clickCard=(html,call)=>html.replace('<div class="card',
  `<div onclick="${call.replace(/"/g,'&quot;')}" class="card click`);

async function render(){
  if(TAB==='dash') return renderDash();
  if(TAB==='mfg') return renderMfg();
  if(TAB==='sales') return renderSales();
  if(TAB==='order') return renderOrder();
  if(TAB==='alert') return renderAlert();
  if(TAB==='ask') return renderAsk();
  if(TAB==='health') return renderHealth();
  if(TAB==='oee') return renderOee();
  if(TAB==='mach') return renderMach();
  if(TAB==='data') return renderData();

function helpBtn(key){
  const h = HELP[key];
  if(!h) return '';
  return `<button class="help" type="button" aria-label="${esc(h[0])} 설명"
    title="${esc(h[0])}" onclick="openHelp('${key}')">?</button>`;
}

function openHelp(key){
  const h = HELP[key]; if(!h) return;
  let box = $('helpbox');
  if(!box){
    box = document.createElement('div');
    box.id = 'helpbox'; box.className = 'helpbox hide';
    document.body.appendChild(box);
    box.addEventListener('click', e => { if(e.target === box) closeHelp(); });
  }
  box.innerHTML = `<div class="hcard">
    <h4>${esc(h[0])}</h4>
    ${h[1].split('\n').map(t => `<p>${esc(t)}</p>`).join('')}
    <button class="act sec" onclick="closeHelp()">닫기</button>
  </div>`;
  box.classList.remove('hide');
}
function closeHelp(){ const b = $('helpbox'); if(b) b.classList.add('hide'); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeHelp(); });


/* ═════ 사용량 원그래프 ═════════════════════════════════════════
   조각 «크기» 는 그 공구가 실제로 돈 시간, 조각 «색» 은 마모 단계다.
   그래서 «크고 빨간 조각» 이 지금 제일 급한 공구가 된다 — 설명을
   읽지 않아도 눈이 먼저 찾는다.

   라이브러리를 안 쓴다. 조각 하나에 <path> 하나씩 그리고, 마우스를
   올리면 가운데 글자만 바꾼다. 붙일 것이 없으니 오프라인에서도 돈다. */
const WLV = w => w >= 100 ? 2 : w >= 90 ? 1 : 0;      // 0 보통 · 1 주의 · 2 교체
const WCOL = ['var(--chart-bar)', 'var(--warn)', 'var(--danger)'];

/* 조각 진하기 — 경보선(90·100%)은 색으로 못박고, 그 아래는 «이 그림 안에서»
   상대적으로 얼마나 닳았나를 진하기로 낸다.
   처음에는 0~90% 를 진하기로 폈는데, 지금 자료는 8~28% 에 몰려 있어
   열 조각이 죄다 비슷한 연파랑이 됐다. 눈에 안 갈리면 없는 것과 같다.
   그래서 «그림에 실제로 들어간 값의 범위» 로 편다. 대신 이건 절대 위험도가
   아니라 상대 비교라는 것을 범례와 «?» 에 분명히 적는다. */
function wden(w, lo, hi){
  if(!(hi > lo)) return 0.72;
  return 0.30 + 0.70 * Math.min(Math.max(((w || 0) - lo) / (hi - lo), 0), 1);
}

function donutTop(tools, n){
  n = n || 10;
  const used = tools.filter(t => (t.hours || 0) > 0)
                    .sort((a, b) => b.hours - a.hours);
  if(!used.length) return '<div class="muted" style="padding:20px 0">돌아간 공구가 없습니다</div>';

  /* 상위 n 종«만» 그린다. 「그 외」를 한 조각으로 넣어 보니 그 회색 덩어리가
     44% 를 차지해 정작 보여 주려던 열 개가 안 보였다. 대신 이 열 종이 전체의
     몇 %인지는 그림 아래에 글로 적는다 — 숨기지 않고 자리만 옮긴 것이다. */
  const top = used.slice(0, n);
  const rest = used.slice(n);
  const restH = rest.reduce((s, t) => s + t.hours, 0);
  const allH = used.reduce((s, t) => s + t.hours, 0);
  const all = top.reduce((s, t) => s + t.hours, 0);

  const ws = top.map(t => t.wear || 0);
  const lo = Math.min(...ws), hi = Math.max(...ws);
  const seg = top.map(t => ({ tool: t.tool, name: t.name, h: t.hours,
                              wear: t.wear, cls: t.cls,
                              col: WCOL[WLV(t.wear)],
                              op: WLV(t.wear) ? 1 : wden(t.wear, lo, hi),
                              lv: WLV(t.wear) }));

  const R = 88, r = 54, C = 100;      // 바깥·안쪽 반지름, 중심
  let a0 = -Math.PI / 2;              // 12시부터 시계방향
  const arcs = seg.map((g, i) => {
    const a1 = a0 + (g.h / all) * Math.PI * 2;
    const big = (a1 - a0) > Math.PI ? 1 : 0;
    const P = (rad, ang) => [C + rad * Math.cos(ang), C + rad * Math.sin(ang)];
    const [x1, y1] = P(R, a0), [x2, y2] = P(R, a1);
    const [x3, y3] = P(r, a1), [x4, y4] = P(r, a0);
    a0 = a1;
    const lab = g.tool == null ? g.name : `T${g.tool} ${g.name}`;
    return `<path d="M${x1} ${y1} A${R} ${R} 0 ${big} 1 ${x2} ${y2}
             L${x3} ${y3} A${r} ${r} 0 ${big} 0 ${x4} ${y4} Z"
      fill="${g.col}" fill-opacity="${g.op.toFixed(3)}" class="dslice" tabindex="0" role="button"
      data-i="${i}" data-tool="${g.tool == null ? '' : g.tool}"
      data-lab="${esc(lab)}" data-h="${g.h.toFixed(2)}"
      data-pct="${(100 * g.h / all).toFixed(1)}"
      data-wear="${g.wear == null ? '' : g.wear.toFixed(2)}"
      data-lv="${g.lv}"><title>${esc(lab)} — ${g.h.toFixed(1)}h${
        g.wear == null ? '' : ` · 마모 ${g.wear.toFixed(2)}%`}</title></path>`;
  }).join('');

  const legend = seg.map((g, i) => `<button class="dleg" data-i="${i}"
      ${g.tool == null ? '' : `onclick="SEL.tool=${g.tool};render()"`}>
      <i style="background:${g.col};opacity:${g.op.toFixed(3)}"></i>
      <span class="nm">${g.tool == null ? esc(g.name) : 'T' + g.tool + ' ' + esc(g.name)}</span>
      <span class="hr">${g.h.toFixed(1)}h</span>
      <span class="we">${g.wear == null ? '' : g.wear.toFixed(1) + '%'}</span>
    </button>`).join('');

  return `<div class="donut">
    <div class="dchart">
      <svg viewBox="0 0 200 200" role="img" aria-label="공구별 사용량">
        ${arcs}
        <circle cx="100" cy="100" r="${r - 1}" fill="var(--surface)"></circle>
      </svg>
      <div class="dmid" id="dmid">
        <b>${top.length}종</b>
        <span>가장 많이 쓴 공구</span>
      </div>
    </div>
    <div class="dlegs">${legend}</div>
  </div>
  <div class="dsum">진한 조각일수록 많이 닳았습니다 — 이 그림 안에서 견준 것으로,
    가장 옅은 것이 ${lo.toFixed(1)}% · 가장 진한 것이 ${hi.toFixed(1)}% 입니다.<br>이 ${top.length}종이 전체 절삭의
    <b>${(100 * all / allH).toFixed(0)}%</b>
    (${all.toFixed(1)}h / ${allH.toFixed(1)}h)${
      rest.length ? ` · 나머지 ${rest.length}종은 ${restH.toFixed(1)}h` : ''}</div>`;
}

/* 마우스를 올리면 가운데 글자를 바꾼다. 조각마다 말풍선을 띄우면
   화면이 어지럽고, 가운데는 어차피 비어 있다. */
function bindDonut(){
  const mid = $('dmid'); if(!mid) return;
  const base = mid.innerHTML;
  const show = el => {
    const w = el.dataset.wear;
    mid.innerHTML = `<b class="${w === '' ? '' : 'lv' + el.dataset.lv}">${
        w === '' ? el.dataset.h + 'h' : w + '%'}</b>` +
      `<span>${esc(el.dataset.lab)}</span>` +
      `<span class="sub">${el.dataset.h}h · 사용량의 ${el.dataset.pct}%</span>`;
    document.querySelectorAll('.dleg').forEach(b =>
      b.classList.toggle('on', b.dataset.i === el.dataset.i));
    document.querySelectorAll('.dslice').forEach(p =>
      p.classList.toggle('dim', p.dataset.i !== el.dataset.i));
  };
  const clear = () => {
    mid.innerHTML = base;
    document.querySelectorAll('.dleg').forEach(b => b.classList.remove('on'));
    document.querySelectorAll('.dslice').forEach(p => p.classList.remove('dim'));
  };
  document.querySelectorAll('.dslice').forEach(p => {
    p.addEventListener('mouseenter', () => show(p));
    p.addEventListener('focus', () => show(p));
    p.addEventListener('click', () => { if(p.dataset.tool){ SEL.tool = +p.dataset.tool; render(); } });
  });
  document.querySelectorAll('.dleg').forEach(b => {
    b.addEventListener('mouseenter', () =>
      show(document.querySelector(`.dslice[data-i="${b.dataset.i}"]`)));
  });
  const box = document.querySelector('.donut');
  if(box) box.addEventListener('mouseleave', clear);
}

/* 그림 색은 위 :root 에서 읽는다. 코드에 박아 두면 화면 색을 바꿔도
   이 그래프만 옛 색으로 남는다. mes_dash.js 도 같은 방식이다. */
function cssVar(name, dflt){
  try{ const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
       return v||dflt; }catch(e){ return dflt; }
}
function drawDays(days){
  const cv=$('cv'); if(!cv) return;
  const ctx=cv.getContext('2d'), w=cv.width=cv.clientWidth*2, h=cv.height=300;
  ctx.clearRect(0,0,w,h);
  const cBar=cssVar('--accent','#1B365D'), cNone=cssVar('--line','#E7EAEE'),
        cLab=cssVar('--chart-label','#64748B'), cVal=cssVar('--ink','#0F172A');
  const mx=Math.max(...days.map(d=>d.cut_h),1), n=days.length, bw=w/n*0.6;
  days.forEach((d,i)=>{
    const x=(i+0.5)*w/n, bh=d.cut_h/mx*(h-50);
    ctx.fillStyle= d.cut_h>0?cBar:cNone;
    /* 모서리를 살짝 굴린다. 옛 브라우저에는 roundRect 가 없으니 그때는 각지게. */
    if(ctx.roundRect){ ctx.beginPath();
      ctx.roundRect(x-bw/2,h-30-bh,bw,Math.max(bh,2),Math.min(6,bw/3)); ctx.fill(); }
    else ctx.fillRect(x-bw/2,h-30-bh,bw,bh);
    if(n<=25){ ctx.fillStyle=cLab; ctx.font='18px sans-serif'; ctx.textAlign='center';
      ctx.fillText(d.date.slice(5),x,h-8);
      if(d.cut_h>0){ ctx.fillStyle=cVal; ctx.fillText(d.cut_h.toFixed(1),x,h-36-bh); } }
  });
}

async function saveProgName(prog){
  const name = ($('pnm')||{}).value||'';
  const r = await fetch('/api/progname',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({prog, name})});
  const j = await r.json();
  if(!r.ok){ alert((j.error||'저장 실패') + (j.hint?('\n\n'+j.hint):'')); return; }
  closeOrder();
  PROGS = await api('/api/programs');   // 이름만 다시 받아 온다
  render();
}

        <div class="muted" style="margin-top:10px;font-size:11.5px">
          현재 관측 기간의 생산 속도 기준. 제품 믹스가 바뀌면 재산출 필요.</div>
      </div>
      <div class="panel">
        <h4>제품별 공구 소모 비중</h4>
        <div style="font-size:11.5px;color:var(--muted);margin-bottom:10px">
          줄을 누르면 그 제품만 봅니다.</div>
        <table><thead><tr><th>제품</th><th class="n">절삭(h)</th><th class="n">마모</th><th style="width:140px">비중</th></tr></thead><tbody>
        ${s.mains.map(m=>`<tr style="cursor:pointer" onclick="pickProduct('${m.main}')">
          <td><b>${nameOf(m)}</b><span class="muted"> · 하위 ${m.progs}개 · 공구 ${m.tools.length}종</span></td>
          <td class="n">${f2(m.hours)}</td><td class="n">${f3(m.wear)}%</td><td>${bar(m.share)}</td></tr>`).join('')}
        </tbody></table>
      </div>
    </div>
    <div class="panel">
      <h4>일별 생산량 · 공구 소모</h4>
      <table><thead><tr><th>일자</th><th class="n">절삭(h)</th><th class="n">생산량</th><th class="n">마모</th>
        <th class="n">개당 마모</th></tr></thead><tbody>
      ${s.days.map(d=>`<tr class="${d.cut_h>0?'':'muted'}"><td>${d.date}</td><td class="n">${f2(d.cut_h)}</td>
        <td class="n">${num(d.parts)}</td><td class="n">${f4(d.wear)}%</td>
        <td class="n">${d.parts? (d.wear/d.parts).toExponential(2):'-'}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
}

/* ── 제품 하나만 보는 화면 ─────────────────────────────────────
   새로 계산하는 값은 없다. 그 제품에 딸린 프로그램의 공구별 마모량을 더한
   것이고, 합은 제품 마모량과 정확히 맞는다.

   일별·생산량 표는 여기 없다. 집계본의 일별 자료는 설비 전체 기준이라
   제품별로 쪼갤 근거가 없다. 대신 그 제품만 담긴 구간이 있으면 그리로
   건너갈 수 있게 해 둔다 — 그건 실제로 나뉘어 있는 자료다. */
function productView(s, m, nameOf){
  if(!m) return '<div class="panel muted">그 제품이 이 구간에 없습니다</div>';
  const b = s.basis;
  const pn = p => {
    const x=((PROGS&&PROGS.progs)||[]).find(y=>y.prog===p.prog);
    return x&&x.name ? `${esc(x.name)} <span class="muted">${p.prog}</span>` : p.prog;
  };
  /* 이 제품 하나만 담긴 구간이 있으면 알려 준다 (없으면 안 보여 준다) */
  const only = (b.segments||[]).find(g => g.key!==b.segment && g.key!=='all'
    && g.mains && g.mains.length===1 && g.mains[0]===m.main);
  const tmax = Math.max(...m.tools.map(t=>t.share), 0.0001);
  const brk = m.tools.filter(t=>t.cls==='breakage').length;
  return `
    <h2>${nameOf(m)} — ${b.segment_label}</h2>
    <div class="desc">
      <button class="act gray" onclick="SALES_SEL=null;renderSales()">← 전체 제품</button>
      <span style="margin-left:10px">하위 프로그램 ${m.prog_rows.length}개 · 사용 공구 ${m.tools.length}종</span>
    </div>
    <div class="cards">
      ${cardHtml('절삭 시간', f2(m.hours),'h')}
      ${cardHtml('마모 기여', f3(m.wear),'%')}
      ${cardHtml('설비 전체 대비', m.share,'%')}
      ${cardHtml('사용 공구', m.tools.length,`종${brk?` · 파손형 ${brk}`:''}`)}
    </div>

    <div class="panel">
      <h4>이 제품에 가장 많이 닳는 공구</h4>
      <div style="font-size:11.5px;color:var(--muted);line-height:1.7;margin-bottom:11px">
        이 제품을 만들 때 어느 공구가 닳는가입니다. 아래 비중을 다 더하면 100% 이고,
        마모 기여를 다 더하면 위의 <b>${f3(m.wear)}%</b> 와 같습니다.
        공구는 제품끼리 공유하므로, 이 표의 공구가 이 제품 전용이라는 뜻은 아닙니다.
      </div>
      <table><thead><tr><th>공구</th><th>이름</th><th>부류</th>
        <th class="n">마모 기여</th><th class="n">이 제품 내 비중</th><th style="width:150px"></th>
        </tr></thead><tbody>
      ${m.tools.map(t=>`<tr style="cursor:pointer" onclick="SEL.tool=${t.tool};goTab('dash')">
        <td><b>T${t.tool}</b></td><td>${t.name}</td>
        <td><span class="tag ${t.cls==='breakage'?'b':'w'}">${t.cls==='breakage'?'파손형':'마모형'}</span></td>
        <td class="n">${f4(t.wear)}%</td><td class="n">${f2(t.share)}%</td>
        <td>${bar(100*t.share/tmax)}</td></tr>`).join('')}
      </tbody></table>
    </div>

    <div class="panel">
      <h4>하위 프로그램 ${m.prog_rows.length}개</h4>
      <table><thead><tr><th>프로그램</th><th class="n">절삭(h)</th><th class="n">행수</th>
        <th class="n">마모 기여</th><th class="n">공구</th><th style="width:150px">제품 내 비중</th>
        </tr></thead><tbody>
      ${m.prog_rows.map(p=>`<tr style="cursor:pointer"
          onclick="SEL.main='${m.main}';SEL.prog='${p.prog}';goTab('mfg')">
        <td><b>${pn(p)}</b></td><td class="n">${f2(p.hours)}</td><td class="n">${num(p.rows)}</td>
        <td class="n">${f3(p.wear)}%</td><td class="n">${p.tools}종</td>
        <td>${bar(100*p.wear/(m.wear||1))}</td></tr>`).join('')}
      </tbody></table>
      <div class="muted" style="margin-top:10px;font-size:11.5px">
        줄을 누르면 제조관리에서 그 프로그램의 상세를 봅니다.</div>
    </div>

    <div class="panel" style="background:var(--raise)">
      <div style="font-size:11.5px;color:var(--muted);line-height:1.7">
        <b>제품별 일별 생산량은 표시하지 않습니다.</b>
        집계본의 일별 자료는 설비 전체 기준이라 제품별로 나눌 근거가 없습니다.
        ${only?`이 제품만 돌아간 구간이 따로 있습니다 —
          위 기준 막대에서 <b>${esc(only.label)}</b> 구간을 고르면 그 기간의 일별 자료를 그대로 보실 수 있습니다.`
          :'제품별 일별이 필요하면 수집 단계에서 제품 구분이 함께 들어와야 합니다.'}
      </div>
    </div>`;
}

// ═════ 공구 주문
/* 좌측에서 고른 화면. null 이면 전부 보여 준다.
   'life' 교체 주기 · 'level' 과다 판정 · 'cand' 과다 · 'over' 평균 초과
   · 'orders' 발주 이력 · 'reps' 교체 이력 */
let ORDER_VIEW = null;
function pickOrder(v){ ORDER_VIEW = (ORDER_VIEW===v? null : v); renderOrder(); }

async function renderOrder(){
  const o = await api('/api/orders');
  const b = o.basis;
  /* 교체 이력 표가 아직 없어도 화면은 떠야 한다 */
  let rep = {rows:[],applied:[],applied_count:0,note:'',table_missing:false,hint:'',can_edit:false};
  try{ rep = await api('/api/replacements'); }catch(e){ /* 없으면 없는 대로 */ }
  REP_LAST = rep;
  const V = ORDER_VIEW;
  const it = (k,label,sub) =>
    `<div class="item ${V===k?'on':''}" onclick="pickOrder('${k}')">${label}<span class="m">${sub}</span></div>`;
  $('side').innerHTML =
    `<div class="item ${V?'':'on'}" onclick="ORDER_VIEW=null;renderOrder()">전체
       <span class="m">아래 항목을 누르면 그것만 봅니다</span></div>
     <h3>기준</h3>` +
    it('life','교체 주기',`${b.life_days}일 · 앵커 ${b.anchor_label}`) +
    it('level','과다 판정',`마모율 ${o.order_level}% 이상`) +
    `<h3>현황</h3>` +
    it('cand','과다',`${o.recommend_count}종 / ${o.candidates.length}종`) +
    it('over','평균 초과',`${o.over_count}종`) +
    it('orders','발주 이력',`${o.orders.length}건`) +
    it('reps','교체 이력',`${rep.rows.length}건 · 반영 ${rep.applied_count}종`);

  const canManage = ME.role==='manager';
  ORDER_CAND = Object.fromEntries(o.candidates.map(c=>[c.tool,c]));
  // 구간이 바뀌어 없어진 공구는 선택에서 뺀다
  [...ORDER_SEL].forEach(t=>{ if(!(t in ORDER_CAND)) ORDER_SEL.delete(t); });

  /* 어느 화면이냐에 따라 표에 담을 공구가 달라진다.
     «과다» 와 «평균 초과» 는 상위 20종으로 자르지 않는다 — 걸러 놓고 또
     자르면 «과다 9종» 이라고 해 놓고 표에는 7종만 나오는 일이 생긴다. */
  const rows = V==='cand' ? o.candidates.filter(c=>c.recommend)
             : V==='over' ? o.candidates.filter(c=>(c.intensity||0) > 1.0)
             : o.candidates.slice(0,20);
  const title = V==='cand' ? `과다 — 마모율 ${o.order_level}% 이상 ${rows.length}종`
              : V==='over' ? `평균 초과 사용 — 사용강도 1배 초과 ${rows.length}종`
              : '소모 많은 순 — 상위 20종';
  const back = V ? `<button class="act gray" onclick="ORDER_VIEW=null;renderOrder()">← 전체</button>` : '';

  const candPanel = `
    <div class="panel">
      <h4>${title}</h4>
      <div style="display:flex;gap:9px;align-items:center;margin-bottom:11px;flex-wrap:wrap">
        <button class="act" ${canManage?'':'disabled'} onclick="openOrder()">
          선택 항목 발주 (<span id="selcnt">${ORDER_SEL.size}</span>)</button>
        <button class="act gray" onclick="ORDER_SEL.clear();renderOrder()">선택 해제</button>
        <button class="act sec" onclick="openReport('order','open=1')">미입고 발주서 출력</button>
        <span class="muted" style="font-size:11.5px">공구 이름 왼쪽 체크박스로 여러 개를 고를 수 있습니다</span>
      </div>
      ${rows.length? `<table><thead><tr>
        <th class="chk"><input type="checkbox" id="allchk" onclick="toggleAll(this.checked)"></th>
        <th>공구</th><th>이름</th><th>부류</th><th class="n">마모율 / 파손 위험도</th>
        <th class="n" title="같은 조건에서 소요 전류가 주당 몇 % 변했는가 — 가중치 없는 관측값">추세</th>
        <th class="n" title="${(b.horizon&&b.horizon.note)||''}">${
          (b.horizon&&b.horizon.label)||'예상'}</th>
        <th class="n">사용강도</th><th class="n">기여도</th><th class="n">절삭(h)</th>
        <th>단계</th><th style="width:86px">교체</th></tr></thead><tbody>
      ${rows.map(c=>`<tr class="${c.recommend?'hot':''}">
        <td class="chk"><input type="checkbox" data-tool="${c.tool}" ${ORDER_SEL.has(c.tool)?'checked':''}
          onclick="toggleTool(${c.tool},this.checked)"></td>
        <td><b>T${c.tool}</b></td><td>${c.name}</td>
        <td><span class="tag ${c.cls==='breakage'?'b':'w'}">${c.cls==='breakage'?'파손형':'마모형'}</span></td>
        <td class="n">${f2(c.wear)}%${c.recommend?' <span class="tag b">과다</span>':''}
          ${c.cls==='breakage'?'<div class="muted" style="font-size:10.5px">파손 위험도</div>':''}
          ${c.replaced_at?`<div class="muted" style="font-size:10.5px">${c.replaced_at} 교체 후</div>`:''}</td>
        <td class="n">${c.trend
          ? `<span style="color:${c.trend.pct_per_week>1?'var(--danger)':'var(--muted)'}">${
              c.trend.pct_per_week>0?'+':''}${f2(c.trend.pct_per_week)}%</span>`
          : '<span class="muted">-</span>'}</td>
        <td class="n ${c.wear_h>=100?'':''}" style="color:var(--muted)">${
          c.wear_h===null||c.wear_h===undefined?'-':f2(c.wear_h)+'%'}</td>
        <td class="n">${inten(c.intensity)}</td>
        <td class="n">${f2(c.share)}%</td>
        <td class="n">${f2(c.hours)}</td>
        <td>${c.level==='정상'?'<span class="muted">정상</span>':`<span class="tag b">${c.level}</span>`}</td>
        <td><button class="act sec" ${canManage?'':'disabled'}
          title="이 공구를 갈았다고 기록합니다 — 그날부터 다시 셉니다"
          onclick="openReplace(${c.tool})">교체 처리</button></td>
        </tr>`).join('')}
      </tbody></table>`
        : `<div class="muted">해당하는 공구가 없습니다</div>`}
    </div>`;

  /* 「교체 주기」 — 지금 100% 가 무엇을 뜻하는지 한자리에 모아 둔다.
     여기 있는 값은 전부 위 기준 막대에서 바꿀 수 있는 것들이다. */
  const lifePanel = `
    <div class="panel">
      <h4>교체 주기 — 무엇을 100% 로 보고 있나</h4>
      <table><tbody>
        <tr><td style="width:190px">기준 일수</td><td><b>${b.life_days}일</b>
          <span class="muted"> — 이 날수를 다 쓰면 마모율 100%</span></td></tr>
        <tr><td>주간 가동시간</td><td><b>${f2(b.week_hours)}h</b>
          <span class="muted"> — 하루 ${b.day_hours.toFixed(2)}h</span></td></tr>
        <tr><td>수명 절삭시간</td><td><b>${num(Math.round(b.life_cut_hours))}h</b>
          <span class="muted"> = ${b.life_days}일 × ${b.day_hours.toFixed(2)}h</span></td></tr>
        <tr><td>앵커 (기준 공구)</td><td><b>${b.anchor_label}</b>
          ${(b.calib&&b.calib.fixed)?'<span class="tag g">고정된 자</span>':''}</td></tr>
        <tr><td>관측 절삭시간</td><td><b>${b.observed_hours}h</b>
          <span class="muted"> = 기준 수명의 ${(100*b.observed_hours/b.life_cut_hours).toFixed(2)}%</span></td></tr>
        ${b.horizon?`<tr><td>${b.horizon.label}</td><td class="muted">${b.horizon.note}</td></tr>`:''}
      </tbody></table>
      <div style="font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:12px">
        <b>이 값들은 가정입니다.</b> 교체 이력이 쌓이기 전까지 «400일» 은 측정값이 아니라
        현장이 정한 목표 수명이고, 주간 가동시간은 «100%가 몇 절삭시간인가» 를 정합니다.
        위쪽 기준 막대에서 바꾸면 화면 전체가 즉시 다시 계산됩니다 — 재집계는 필요 없습니다.
      </div>
    </div>`;

  /* 「과다 판정」 — 임계가 공구를 실제로 어떻게 가르는지 보여 준다.
     숫자만 적어 두면 «70% 가 왜 70% 인가» 를 아무도 확인할 수 없다. */
  const STEP = [['교체',100,'d'],['교체 준비',90,'w'],['주의',70,'w'],['정상',0,'']];
  const levelPanel = (()=>{
    const c = o.candidates;
    const seen = new Set();
    const rowsOf = lo => c.filter(x=>{
      if(seen.has(x.tool) || x.wear < lo) return false;
      seen.add(x.tool); return true; });
    const groups = STEP.map(([nm,lo,cl])=>({nm,lo,cl,list:rowsOf(lo)}));
    return `
    <div class="panel">
      <h4>과다 판정 — 마모율 ${o.order_level}% 이상</h4>
      <div style="font-size:11.5px;color:var(--muted);line-height:1.7;margin-bottom:12px">
        판정은 <b>마모율 하나</b>로만 합니다. 사용강도는 옆에 참고로 둘 뿐,
        판정에는 넣지 않습니다 — 두 가지를 섞으면 어느 쪽 때문에 걸렸는지 알 수 없게 됩니다.
        파손형(TAP · 6mm 미만 드릴)의 숫자는 마모율이 아니라 <b>파손 위험도</b>라,
        같은 70%라도 뜻이 다릅니다.
      </div>
      <table><thead><tr><th>단계</th><th class="n">임계</th><th class="n">공구</th>
        <th>해당 공구</th></tr></thead><tbody>
      ${groups.map(g=>`<tr>
        <td>${g.cl?`<span class="tag ${g.cl==='d'?'b':'w'}">${g.nm}</span>`:`<span class="muted">${g.nm}</span>`}</td>
        <td class="n">${g.lo?g.lo+'% 이상':'-'}</td>
        <td class="n">${g.list.length}종</td>
        <td class="muted">${g.list.length? g.list.slice(0,8).map(x=>'T'+x.tool).join(' · ')
          + (g.list.length>8?` 외 ${g.list.length-8}종`:'') : '-'}</td></tr>`).join('')}
      </tbody></table>
      <div class="muted" style="margin-top:10px;font-size:11.5px">
        좌측 「과다」를 누르면 ${o.order_level}% 이상인 ${o.recommend_count}종만 표로 봅니다.</div>
    </div>`;
  })();

  const head = `
    <h2>공구 주문 — ${b.segment_label}</h2>
    <div class="desc">${back}
      <span style="${back?'margin-left:10px':''}">소모가 많은 순 — ${
        canManage?'발주 가능':'조회 전용 (관리자만 발주)'}</span></div>
    <div class="cards">
      ${clickCard(cardHtml(`마모 ${o.order_level}% 초과`, o.recommend_count,'종',
          o.recommend_count?'warn':'ok'), `pickOrder('cand')`)}
      ${clickCard(cardHtml('평균 초과 사용', o.over_count,'종'), `pickOrder('over')`)}
      ${clickCard(cardHtml('발주 이력', o.orders.length,'건'), `pickOrder('orders')`)}
    </div>`;

  const warnPanels = `
    <div class="panel" style="background:var(--raise)">
      <div style="font-size:11.5px;color:var(--muted);line-height:1.7">
        <b>잔여 일수와 발주 시점을 표시하지 않습니다.</b>
        "며칠 남았다"를 말하려면 «이 공구가 몇 일 만에 수명을 다했는가» 가 쌓여야 합니다.
        아래 교체 이력이 공구마다 두세 번씩 쌓이면 그때 되살립니다.
        지금은 얼마나 닳았는지(마모율)와 평균보다 몇 배 빨리 닳는지(사용강도)로 우선순위를 정합니다.
      </div>
    </div>
    ${rep.table_missing?`<div class="panel" style="border-color:var(--warn)">
      <div style="font-size:11.5px;color:var(--warn-ink);line-height:1.7">
        <b>교체 이력을 저장할 곳이 아직 없습니다.</b><br>${rep.hint}
        그 전까지 「교체 처리」를 눌러도 저장되지 않습니다.
      </div></div>`:''}`;

  const repPanel = `<div class="panel">
      <h4>공구 교체 이력</h4>
      <div style="font-size:11.5px;color:var(--muted);line-height:1.7;margin-bottom:10px">
        공구를 갈면 여기에 적습니다. 적는 순간부터 그 공구의 마모율은
        <b>교체일부터 다시</b> 셉니다. 교체일은 그날을 포함합니다 (그날 아침에 갈았다고 봅니다).
        같은 공구를 여러 번 갈았으면 가장 마지막 날짜만 계산에 씁니다 — 예전 줄은 이력으로 남습니다.
        ${rep.note?`<br><span style="color:var(--warn-ink)">${rep.note}</span>`:''}
      </div>
      <table><thead><tr><th>교체일</th><th>공구</th><th>사유</th><th>기록</th>
        <th class="n">현재 반영</th><th style="width:64px"></th></tr></thead><tbody>
      ${rep.rows.length? rep.rows.map(r=>{
        const on = (rep.applied||[]).find(a=>a.tool===r.tool && a.at===r.at);
        return `<tr><td class="mono">${r.at}</td>
        <td>T${r.tool} ${r.name||''}</td>
        <td class="muted">${r.note||'-'}</td>
        <td class="muted">${r.by||''} · ${(r.created_at||'').slice(0,10)}</td>
        <td class="n">${on? (on.applied?'<span class="tag g">반영</span>'
              :'<span class="tag w" title="이 집계본에는 날짜별 자료가 없습니다">못 자름</span>')
            :'<span class="muted" title="이 공구의 더 최근 교체 기록이 있습니다">지난 이력</span>'}</td>
        <td>${canManage?`<button class="act gray"
          title="잘못 적었을 때만 지웁니다 — 지우면 그 전 마모가 되살아납니다"
          onclick="delReplace('${r.id}')">지움</button>`:''}</td></tr>`;
      }).join('')
        : '<tr><td colspan=6 class="muted">아직 교체 기록이 없습니다 — 위 표에서 「교체 처리」를 누르세요</td></tr>'}
      </tbody></table>
    </div>`;
  const ordPanel = `<div class="panel">
      <h4>발주 이력</h4>
      <table><thead><tr><th>일시</th><th>공구</th><th class="n">수량</th><th>담당</th><th>상태</th>
        <th>비고</th><th style="width:74px">출력</th></tr></thead><tbody>
      ${o.orders.length? o.orders.map(x=>`<tr><td class="mono">${x.at}</td>
        <td>T${x.tool} ${x.name}</td><td class="n">${x.qty}</td><td>${x.by}</td>
        <td><span class="tag ${x.status==='입고'?'g':'w'}">${x.status}</span>
          ${canManage&&x.status!=='입고'?`<button class="act sec" style="margin-left:6px"
            onclick="setStatus('${x.id}','입고')">입고 처리</button>`:''}
          ${canManage&&x.status==='입고'?`<button class="act sec" style="margin-left:6px"
            title="이 공구를 실제로 물렸다면 눌러 주세요 — 그날부터 다시 셉니다"
            onclick="openReplace(${x.tool})">교체 처리</button>`:''}</td>
        <td class="muted">${x.note||''}</td>
        <td><button class="act sec" title="이 건의 발주서를 새 창에서 엽니다"
          onclick="openReport('order','${x.batch?('batch='+x.batch):('ids='+x.id)}')">발주서</button></td>
        </tr>`).join('')
        : '<tr><td colspan=7 class="muted">발주 이력이 없습니다</td></tr>'}
      </tbody></table>
    </div>`;

  const body =
      V==='life'   ? lifePanel + candPanel
    : V==='level'  ? levelPanel + candPanel
    : V==='cand'   ? candPanel
    : V==='over'   ? candPanel
    : V==='orders' ? reportBar('order','open=1') + ordPanel
    : V==='reps'   ? (rep.table_missing?warnPanels:'') + repPanel
    : warnPanels + reportBar('order','open=1') + candPanel + repPanel + ordPanel;

  $('main').innerHTML = head + body;
}

// ── 다중 선택
let ORDER_CAND = {};
function toggleTool(t,on){
  on ? ORDER_SEL.add(t) : ORDER_SEL.delete(t);
  const el=$('selcnt'); if(el) el.textContent=ORDER_SEL.size;
  const all=$('allchk');
  if(all){ const boxes=[...document.querySelectorAll('td.chk input')];
    all.checked = boxes.length>0 && boxes.every(b=>b.checked); }
}
function toggleAll(on){
  document.querySelectorAll('td.chk input').forEach(b=>{
    b.checked=on; toggleTool(+b.dataset.tool,on);
  });
}

// ── 발주 팝업
function openOrder(){
  if(ME.role!=='manager'){ alert('관리자만 발주할 수 있습니다'); return; }
  if(ORDER_SEL.size===0){ alert('발주할 공구를 하나 이상 선택하세요'); return; }
  const items=[...ORDER_SEL].map(t=>ORDER_CAND[t]).filter(Boolean)
    .sort((a,b)=>b.wear-a.wear);
  $('modal').classList.remove('hide');
  $('modal').innerHTML = `
    <div class="mbox">
      <div class="mhead">
        <h3>공구 발주 — ${items.length}종</h3>
        <div class="s">공구별로 수량을 지정하세요. 기본값은 1개입니다.</div>
      </div>
      <div class="mbody">
        ${items.map(c=>`<div class="qrow" data-tool="${c.tool}">
          <div class="nm"><b style="display:inline;font-size:12.5px;color:var(--ink);font-weight:600">T${c.tool}</b>
            ${c.name}
            <b>마모율 ${f2(c.wear)}% · 사용강도 ${inten(c.intensity)} ·
               ${c.cls==='breakage'?'파손형':'마모형'}${c.recommend?' · 과다':''}</b></div>
          <input type="number" min="1" max="999" value="1" class="qty" onchange="sumQty()">
          <span class="muted" style="font-size:11.5px">개</span>
          <button class="del" title="목록에서 제외"
            onclick="ORDER_SEL.delete(${c.tool});openOrder()">×</button>
        </div>`).join('')}
        <input id="mnote" placeholder="비고 (선택) — 전체 항목에 함께 기록됩니다">
      </div>
      <div class="mfoot">
        <span class="tot">합계 <b id="qtot">${items.length}</b>개</span>
        <button class="act gray" onclick="closeOrder()">취소</button>
        <button class="act" onclick="submitOrder()">발주 등록</button>
      </div>
    </div>`;
}
function closeOrder(){ $('modal').classList.add('hide'); $('modal').innerHTML=''; }
function sumQty(){
  const n=[...document.querySelectorAll('#modal .qty')]
    .reduce((a,b)=>a+(Math.max(1,+b.value||1)),0);
  const el=$('qtot'); if(el) el.textContent=n;
}
async function submitOrder(){
  const note = $('mnote').value;
  const items = [...document.querySelectorAll('#modal .qrow')].map(r=>{
    const t=+r.dataset.tool;
    return {tool:t, name:(ORDER_CAND[t]||{}).name||'',
            qty:Math.max(1,+r.querySelector('.qty').value||1), note};
  });
  if(!items.length){ alert('발주할 공구가 없습니다'); return; }
  const r = await fetch('/api/order',{method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify({items,note})});
  const j = await r.json();
  if(!r.ok){ alert(j.error||'발주 실패'); return; }
  closeOrder(); ORDER_SEL.clear(); renderOrder();
}
async function setStatus(id,status){
  await fetch(`/api/order/${id}/status`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({status})});
  renderOrder();
}

// ── 공구 교체 처리
/* 「갈았다」를 적는 곳. 적는 순간부터 그 공구는 교체일부터 다시 센다.
   그래서 확인 없이 그냥 저장하지 않는다 — 무엇이 사라지는지 먼저 보여준다. */
let REP_LAST = {rows:[],applied:[]};
let DASH_TOOL = null;          // 대시보드가 지금 보고 있는 공구 상세
const today10 = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000)
  .toISOString().slice(0,10);

function openReplace(tno){
  if(ME.role!=='manager'){ alert('관리자만 교체를 기록할 수 있습니다'); return; }
  /* 주문 탭이 아니라 대시보드에서 눌렀을 수도 있다. 그때는 상세 화면이
     들고 있는 값을 쓴다. 없는 값을 0 으로 보여주면 안 된다. */
  const c = ORDER_CAND[tno]
    || ((DASH_TOOL && DASH_TOOL.tool===tno) ? DASH_TOOL : null)
    || {tool:tno,name:'',wear:null};
  const prev = (REP_LAST.rows||[]).filter(r=>r.tool===tno).sort((a,b)=>b.at<a.at?-1:1);
  $('modal').classList.remove('hide');
  $('modal').innerHTML = `
    <div class="mbox">
      <div class="mhead">
        <h3>공구 교체 — T${c.tool} ${c.name||''}</h3>
        <div class="s">이 공구를 갈았다고 기록합니다. 교체일부터 마모율을 다시 셉니다.</div>
      </div>
      <div class="mbody">
        <div class="row"><span>지금 마모율</span><span class="mono">${
          c.wear===null||c.wear===undefined?'-':f2(c.wear)+' %'}</span></div>
        <div class="row"><span>기록 후</span><span class="mono">교체일 이후만 다시 셉니다</span></div>
        ${prev.length?`<div class="row"><span>이전 교체</span>
          <span class="mono">${prev[0].at}</span></div>`:''}
        <div style="margin-top:12px">
          <label style="display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px">
            교체일 — 그날을 포함해서 셉니다. 미래 날짜는 넣을 수 없습니다.</label>
          <input type="date" id="rat" value="${today10()}" max="${today10()}">
        </div>
        <input id="rnote" style="margin-top:9px" placeholder="사유 (선택) — 마모 / 파손 / 정기교체 등">
        <div style="font-size:11.5px;color:var(--warn-ink);line-height:1.7;margin-top:11px">
          교체일 이전에 이 공구가 닳은 몫은 계산에서 빠집니다.
          날짜를 실제보다 앞당겨 적으면 마모가 사라지고 경보가 늦게 뜹니다.
          잘못 적었으면 교체 이력에서 지우면 되돌아옵니다.
        </div>
      </div>
      <div class="mfoot">
        <button class="act gray" onclick="closeOrder()">취소</button>
        <button class="act" onclick="submitReplace(${c.tool})">교체 기록</button>
      </div>
    </div>`;
}

async function submitReplace(tno){
  const at = ($('rat')||{}).value || '';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(at)){ alert('교체일을 골라 주세요'); return; }
  const c = ORDER_CAND[tno] || {};
  const r = await fetch('/api/replacement',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({tool:tno, name:c.name||'', at, note:($('rnote')||{}).value||''})});
  const j = await r.json();
  if(!r.ok){ alert((j.error||'교체 기록 실패') + (j.hint?('\n\n'+j.hint):'')); return; }
  closeOrder(); render();       // 대시보드에서 눌렀으면 대시보드가 다시 그려진다
}

async function delReplace(id){
  if(!confirm('이 교체 기록을 지웁니다.\n지우면 교체일 이전의 마모가 다시 살아납니다.')) return;
  const r = await fetch(`/api/replacement/${id}/delete`,{method:'POST',
    headers:{'Content-Type':'application/json'}, body:'{}'});
  const j = await r.json();
  if(!r.ok){ alert(j.error||'지우기 실패'); return; }
  renderOrder();
}

// ═════ 알림
/* 좌측·카드에서 고른 알림 갈래. null 이면 전부 보여 준다.
   'danger' 위험 · 'break' 파손형 즉시 · 'warn' 주의 · 'unread' 안 읽음 */
let ALERT_SEL = null;
function pickAlert(v){ ALERT_SEL = (ALERT_SEL===v? null : v); renderAlert(); }

async function renderAlert(){
  const a = await api('/api/alerts');
  const canManage = ME.role==='manager';
  const badge=$('badge'), n=a.counts.danger+a.counts.unread;
  if(n){ badge.textContent=n; badge.classList.remove('hide'); } else badge.classList.add('hide');

  const card = x => `<div class="al ${x.level}${x.unread?' unread':''}">
      <div class="t">${x.title}</div><div class="b">${x.body||''}</div>
      ${x.evidence?`<div class="e">근거 — ${x.evidence}</div>`:''}
      ${x.by?`<div class="meta"><span>${x.by} · ${x.at} · 수신 ${
        {all:'전체',manager:'관리자',operator:'작업자'}[x.to]||x.to}</span>
        ${x.unread?`<button class="act sec" onclick="readAlert('${x.id}')">읽음</button>`:'<span>읽음</span>'}
      </div>`:''}
    </div>`;

  /* 갈래마다 «자동 경보에서 무엇을 남기나 · 받은 알림에서 무엇을 남기나» 를
     한 곳에 적어 둔다. 두 목록을 따로 거르면 규칙이 갈라진다. */
  const V = ALERT_SEL;
  const FILT = {
    danger: {label:'위험', auto:x=>x.level==='danger', manual:x=>x.level==='danger',
             desc:'마모율이 교체 임계를 넘었거나 파손형에서 즉시 경보가 난 건'},
    break:  {label:'파손형 즉시', auto:x=>x.kind==='break', manual:()=>false,
             desc:'TAP·6mm 미만 드릴 — 과부하·충격 이벤트나 하루 급증. 마모율 임계와는 별개입니다'},
    warn:   {label:'주의', auto:x=>x.level==='warn', manual:x=>x.level==='warn',
             desc:'교체 준비 단계이거나 사용강도가 기준을 넘은 건'},
    unread: {label:'안 읽은 알림', auto:()=>false, manual:x=>x.unread,
             desc:'사람이 보낸 알림 중 아직 안 읽은 것 — 자동 경보에는 읽음 표시가 없습니다'},
  };
  const F = V && FILT[V];
  const auto   = F ? a.auto.filter(F.auto)     : a.auto;
  const manual = F ? a.manual.filter(F.manual) : a.manual;

  const it = (k,label,sub) =>
    `<div class="item ${V===k?'on':''}" onclick="pickAlert('${k}')">${label}<span class="m">${sub}</span></div>`;
  $('side').innerHTML = `<h3>경보 규칙</h3>` +
    a.rules.wear.map(r=>`<div class="item">마모율 ${r.threshold}%<span class="m">${r.name}</span></div>`).join('') +
    `<div class="item">사용강도 ${a.rules.intensity}배<span class="m">과다 소모 경고</span></div>
     ${a.rules.breakage?`<h3>파손형 (TAP · 6mm 미만 드릴)</h3>
     <div class="item">임계 초과 이벤트<span class="m">과부하·충격 발생 시 즉시</span></div>
     <div class="item">하루 급증 ${a.rules.breakage.spike}배<span class="m">직전 ${a.rules.breakage.lookback}일 평균 대비</span></div>`:''}
     <h3>현황</h3>
     <div class="item ${V?'':'on'}" onclick="ALERT_SEL=null;renderAlert()">전체
       <span class="m">아래 항목을 누르면 그것만 봅니다</span></div>` +
    it('danger','위험',`${a.counts.danger}건`) +
    (a.counts.breakage!==undefined? it('break','그중 파손형 즉시',`${a.counts.breakage}건`) : '') +
    it('warn','주의',`${a.counts.warn}건`) +
    it('unread','안 읽은 알림',`${a.counts.unread}건`);

  $('main').innerHTML = `
    <h2>알림${F?` — ${F.label}`:''}</h2>
    <div class="desc">
      ${F?`<button class="act gray" onclick="ALERT_SEL=null;renderAlert()">← 전체 알림</button>
          <span style="margin-left:10px">${F.desc}</span>`
        :'자동 경보는 선택한 기준으로 매번 다시 판정합니다 — 규칙 기반이라 근거를 그대로 보여줍니다'}
    </div>
    <div class="cards">
      ${clickCard(cardHtml('위험', a.counts.danger,'건', a.counts.danger?'warn':'ok'), `pickAlert('danger')`)}
      ${a.counts.breakage!==undefined? clickCard(
        cardHtml('파손형 즉시', a.counts.breakage,'건', a.counts.breakage?'warn':'ok'), `pickAlert('break')`):''}
      ${clickCard(cardHtml('주의', a.counts.warn,'건'), `pickAlert('warn')`)}
      ${clickCard(cardHtml('안 읽은 알림', a.counts.unread,'건', a.counts.unread?'hl':''), `pickAlert('unread')`)}
    </div>

    ${(canManage && !F)?`<div class="panel">
      <h4>작업자에게 알림 보내기</h4>
      <div class="sendbox">
        <select id="s_to"><option value="all">전체</option>
          <option value="operator">작업자</option><option value="manager">관리자</option></select>
        <select id="s_lv"><option value="danger">위험</option>
          <option value="warn">주의</option><option value="info" selected>안내</option></select>
        <input id="s_title" placeholder="제목 — 예: T33 교체 요망">
      </div>
      <input id="s_body" placeholder="내용 (선택)" style="width:100%;padding:8px 10px;
        border:1px solid var(--line);border-radius:6px;font-size:12.5px;margin-bottom:9px">
      <button class="act" onclick="sendAlert()">전송</button>
    </div>`:''}

    ${(F && !manual.length && !auto.length)?`<div class="panel">
      <div class="muted">${F.label}에 해당하는 알림이 없습니다.</div></div>`:''}

    ${(!F || manual.length)?`<div class="panel">
      <h4>받은 알림 ${manual.length?`(${manual.length})`:''}</h4>
      ${manual.length? manual.map(card).join('') : '<div class="muted">받은 알림이 없습니다</div>'}
    </div>`:''}

    ${(!F || auto.length)?`<div class="panel">
      <h4>자동 경보 ${auto.length?`(${auto.length})`:''}</h4>
      ${auto.length? auto.map(card).join('') : '<div class="muted">경보 없음</div>'}
    </div>`:''}`;
}

async function sendAlert(){
  const body={to:$('s_to').value, level:$('s_lv').value,
              title:$('s_title').value, body:$('s_body').value};
  if(!body.title.trim()){ alert('제목을 입력하세요'); return; }
  const r=await fetch('/api/alert/send',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok){ alert(j.error); return; }
  renderAlert();
}
async function readAlert(id){
  await fetch(`/api/alert/${id}/read`,{method:'POST'});
  renderAlert();
}

// ═════ 질의
let QA=[];
async function renderAsk(){
  const info = await api('/api/audit');
  const ex=['제일 많이 닳은 공구는?','8월 20일 가동시간 알려줘','현재 경보 요약해줘',
            'T33 상태는?','누가 발주했나?','과부하가 많은 프로그램은?'];
  $('side').innerHTML = `<h3>agent</h3>
    <div class="item">엔진<span class="m">${info.agent.provider}</span></div>
    <div class="item">모드<span class="m">${info.agent.online?'온라인 (Claude API)':'오프라인 (규칙 기반)'}</span></div>
    <h3>MES 활동 로그</h3>` +
    (info.log.length? info.log.slice(0,25).map(l=>
      `<div class="item">${l.action}<span class="m">${l.at} · ${l.user}${l.detail?' · '+l.detail:''}</span></div>`).join('')
      : '<div class="item muted">기록 없음</div>');

  $('main').innerHTML = `
    <h2>질의</h2>
    <div class="desc">집계된 값과 MES 활동 로그로 답합니다 — 원본 데이터는 전송하지 않습니다</div>
    ${info.agent.online?'':`<div class="panel" style="background:var(--warn-soft);border-color:var(--warn-line)">
      <div style="font-size:12px;color:var(--warn-ink);line-height:1.7">
        <b>규칙 기반 모드</b> — <code>supabase functions deploy mes-ask</code> 를
        실행하면 Claude 가 자유로운 질문에 답합니다. 지금은 정해진 형태만 답할 수 있습니다.
      </div></div>`}
    <div class="panel">
      <div>${ex.map(q=>`<button class="exq" onclick="ask('${q}')">${q}</button>`).join('')}</div>
      <textarea id="askq" placeholder="질문을 입력하세요"
        onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey))ask()"></textarea>
      <div style="margin-top:9px;display:flex;gap:9px;align-items:center">
        <button class="act" onclick="ask()">질문 (Ctrl+Enter)</button>
        <span class="muted" style="font-size:11.5px">기준: ${BASIS.segment_label} ·
          ${BASIS.life_days}일 · 앵커 ${BASIS.anchor_label}</span>
      </div>
    </div>
    <div class="panel" id="qalog">
      <h4>대화</h4>
      ${QA.length? QA.map(x=>`<div class="qa"><div class="q">${x.q}</div>
        <div class="a">${x.a}</div>
        <div class="src">${x.provider}${x.fallback?' · 오프라인으로 대체됨':''}${
          x.context_size?` · 전송 ${(x.context_size/1024).toFixed(1)}KB`:''}</div></div>`).reverse().join('')
        : '<div class="muted">질문을 입력하면 여기에 표시됩니다</div>'}
    </div>`;
}
async function ask(preset){
  const q = (preset || $('askq').value).trim();
  if(!q) return;
  if(!preset) $('askq').value='';
  QA.push({q, a:'답변 생성 중...', provider:''});
  renderAsk();
  try{
    const r = await fetch('/api/ask?'+qs(),{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({q})});
    const j = await r.json();
    QA[QA.length-1] = {q, a: j.answer || j.error || '응답 없음',
                       provider: j.provider||'', fallback: j.fallback,
                       context_size: j.context_size};
  }catch(e){ QA[QA.length-1] = {q, a:'요청 실패 — '+e, provider:''}; }
  renderAsk();
}

// ═════ 공통 — 빈 칸 명시
function gapsHtml(gaps, title){
  if(!gaps || !gaps.length) return '';
  return `<div class="panel">
    <h4>${title||'이 화면에서 비어 있는 항목'}</h4>
    <div class="muted" style="font-size:11.5px;margin-bottom:10px">
      데이터가 없어 만들지 못한 기능입니다. 숨기지 않고 사유와 대체 지표를 함께 적습니다.</div>
    ${gaps.map(g=>`<div class="gap"><div class="t">${g.feature} — 비어 있음</div>
      <div class="w">${g.why}</div>
      ${g.instead?`<div class="i">대체 — ${g.instead}</div>`:''}</div>`).join('')}
    <button class="act" style="margin-top:6px" onclick="askGaps()">Agent 에게 설명 요청</button>
  </div>`;
}
function askGaps(){
  TAB='ask';
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='ask'));
  render().then(()=>ask('지금 화면에서 데이터가 없어 비어 있는 항목들이 왜 비었는지, 무엇을 받아야 채울 수 있는지, 그동안 대신 볼 지표는 무엇인지 설명해줘'));
}
const st1 = (o,k)=> o && o[k] ? o[k] : null;
function statRow(label, s, unit){
  if(!s) return `<div class="row"><span>${label}</span><span class="muted">데이터 없음</span></div>`;
  return `<div class="row"><span>${label}${s.approx?' <span class="muted" style="font-size:10.5px">근사</span>':''}</span>
    <span class="mono">중앙 ${f2(s.p50)}${unit} · p95 ${f2(s.p95)}${unit} · 최대 ${f2(s.max)}${unit}</span></div>`;
}

        파일 3개 기준 2~3분 걸리며, 도는 동안에도 다른 탭은 그대로 볼 수 있습니다.
      </div>
      <div class="cards" style="margin-bottom:11px">
        ${cardHtml('현재 집계본', d.built||'-','')}
        ${cardHtml('읽은 파일', (d.sources||[]).length,'개')}
      </div>
      ${d.rebuild.pandas ? `
        <button class="act" id="rbbtn" onclick="startRebuild()"
          ${d.rebuild.running?'disabled':''}>${d.rebuild.running?'집계 중...':'지금 재집계'}</button>`
      : `<div class="gap"><div class="t">서버에서 재집계할 수 없습니다</div>
          <div class="w">이 파이썬에 pandas·numpy 가 없습니다. 집계는 벡터 연산이 필요해
            표준 라이브러리만으로는 200만 행을 처리할 수 없습니다.</div>
          <div class="i">터미널에서 <code>pip install pandas numpy</code> 후
            <code>python mes_rebuild.py</code> 를 실행하세요</div></div>`}
      <div id="rblog" class="hide" style="margin-top:11px;background:var(--term-bg);color:var(--term-ink);
        border-radius:7px;padding:12px 14px;font-size:11.5px;line-height:1.75;
        max-height:260px;overflow-y:auto;font-family:Consolas,monospace"></div>
    </div>
    <div id="matchbox"></div>`;
  if(MATCH) drawMatch();
  if(d.rebuild.running || (d.rebuild.lines||[]).length) showRebuild(d.rebuild);
  if(d.rebuild.running) pollRebuild();
}

function showRebuild(r){
  const el=$('rblog'); if(!el) return;
  el.classList.remove('hide');
  const head = r.running ? '집계 중...' :
    (r.code===0 ? '완료' : (r.code==null?'':'실패 (코드 '+r.code+')'));
  el.innerHTML = (head?`<div style="color:${r.code===0?'var(--term-ok)':(r.running?'var(--term-warn)':'var(--term-err)')}">
    ■ ${head}${r.started?' · 시작 '+r.started:''}${r.ended?' · 종료 '+r.ended:''}</div>`:'')
    + (r.lines||[]).map(l=>`<div>${l.replace(/</g,'&lt;')}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}

let RBTIMER=null;
async function startRebuild(){
  const b=$('rbbtn'); if(b){ b.disabled=true; b.textContent='집계 중...'; }
  const r = await fetch('/api/rebuild',{method:'POST'});
  const j = await r.json();
  if(!r.ok){
    alert((j.error||'실패') + (j.hint? '\n\n'+j.hint : ''));
    if(b){ b.disabled=false; b.textContent='지금 재집계'; }
    return;
  }
  pollRebuild();
}
function pollRebuild(){
  clearInterval(RBTIMER);
  RBTIMER = setInterval(async ()=>{
    const r = await api('/api/rebuild/status');
    showRebuild(r);
    if(!r.running){
      clearInterval(RBTIMER); RBTIMER=null;
      const b=$('rbbtn'); if(b){ b.disabled=false; b.textContent='지금 재집계'; }
      if(r.code===0){
        fillBasisBar(await api('/api/basis'));   // 새 집계본 기준으로 상단 바 갱신
        await reload();
      }
    }
  }, 1500);
}

const UPLOAD_MAX = 80*1024*1024;      // 사내 단독 서버라 넉넉히 둔다

async function doUpload(el){
  const f = el.files[0]; if(!f) return;
  if(f.size > UPLOAD_MAX){
    $('upstat').innerHTML = `<b style="color:var(--danger)">파일이 큽니다 (${(f.size/1048576).toFixed(1)}MB).</b>
      화면 업로드는 ${UPLOAD_MAX/1048576}MB 까지입니다.
      큰 파일은 폴더에 직접 넣고 <code>python mes_rebuild.py</code> 를 실행하세요.`;
    return;
  }
  $('upstat').textContent = `읽는 중... (${(f.size/1048576).toFixed(1)}MB)`;
  // 파일 전체를 보낸다. 앞부분만 보내면 매칭은 되지만 집계가 잘린 데이터로 돌아간다.
  const text = await f.text();
  $('upstat').textContent = '매칭 중...';
  const r = await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:f.name, text})});
  const j = await r.json();
  if(!r.ok){ $('upstat').innerHTML=`<b style="color:var(--danger)">${j.error}</b>`; return; }
  MATCH = j;
  $('upstat').innerHTML = `<b>${j.file}</b> · ${j.rows_sampled}행 표본 · ${j.size_kb}KB`;
  drawMatch();
}

function drawMatch(){
  const j = MATCH;
  const opts = Object.entries(STDCOLS).map(([k,v])=>`<option value="${k}">${k} — ${v}</option>`).join('');
  const cls = h => h==='별칭 사전'||h==='이름 일치'?'dict': h==='이름 유사도'?'sim':
                   h==='Agent 판단'?'llm': h==='사람 확정'?'man':'none';
  $('matchbox').innerHTML = `
    <div class="cards">
      ${cardHtml('전체 컬럼', j.total,'개')}
      ${cardHtml('매칭됨', j.mapped,'개','ok')}
      ${cardHtml('미매칭', j.unmatched,'개', j.unmatched?'warn':'')}
      ${cardHtml('별칭 사전', j.by_dict,'개')}
      ${cardHtml('유사도', j.by_sim,'개')}
      ${cardHtml('Agent', j.by_llm,'개', j.by_llm?'hl':'')}
    </div>
    ${j.missing_required.length? `<div class="panel" style="background:var(--danger-soft);border-color:var(--danger-line)">
      <b style="color:var(--danger)">필수 컬럼 누락</b> — ${j.missing_required.join(', ')}<br>
      <span class="muted" style="font-size:11.5px">이 컬럼들이 없으면 마모 계산을 할 수 없습니다.</span></div>`:''}
    ${!j.llm_used? `<div class="panel" style="background:var(--warn-soft);border-color:var(--warn-line)">
      <span style="font-size:12px;color:var(--warn-ink)">Agent(Claude API) 없이 사전과 유사도만으로 매칭한 결과입니다.
      미매칭 컬럼은 아래에서 직접 지정하세요. API 키를 넣으면 값의 형태를 보고 Agent 가 제안합니다.</span></div>`:''}
    <div class="panel">
      <h4>컬럼 매칭 — 확인 후 확정</h4>
      <table><thead><tr><th>원본 컬럼</th><th style="width:210px">표준 컬럼</th><th>판단</th>
        <th>근거</th><th>값 샘플</th></tr></thead><tbody>
      ${j.rows.map(r=>`<tr class="${r.target?'':'hot'}">
        <td><b>${r.source}</b></td>
        <td><select class="msel" data-src="${r.source}">
          <option value="">— 대응 없음 —</option>${opts}</select></td>
        <td><span class="how ${cls(r.how)}">${r.how}</span>
          ${r.score<1&&r.score>0?`<span class="muted" style="font-size:10.5px"> ${(r.score*100).toFixed(0)}%</span>`:''}</td>
        <td style="font-size:11.5px;color:var(--muted)">${r.why}</td>
        <td class="muted" style="font-size:11px">${(r.profile.sample||[]).slice(0,4).join(', ')}</td>
      </tr>`).join('')}
      </tbody></table>
      <div style="margin-top:12px;display:flex;gap:9px;align-items:center">
        <button class="act" onclick="confirmMatch()">이 매핑으로 확정</button>
        <span class="muted" style="font-size:11.5px">확정하면 매핑표가 저장되고 활동 로그에 남습니다</span>
      </div>
    </div>`;
  j.rows.forEach(r=>{
    const el=document.querySelector(`select[data-src="${CSS.escape(r.source)}"]`);
    if(el) el.value = r.target || '';
  });
}

async function confirmMatch(){
  const mapping={};
  document.querySelectorAll('#matchbox select.msel').forEach(el=>{ mapping[el.dataset.src]=el.value; });
  const r = await fetch('/api/upload/confirm',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({file:MATCH.file, mapping})});
  const j = await r.json();
  if(!r.ok){ alert(j.error); return; }
  alert(`확정했습니다 — ${j.mapped}개 컬럼이 매핑되었습니다.\n\n집계에 반영하려면 mes_build_data.py 를 실행하세요.`);
  MATCH=null; renderData();
}

// ═════ 서류 출력
// 현재 선택한 기준(구간·수명·시간·앵커)을 그대로 넘긴다. 화면과 서류의 숫자가 갈리면 안 된다.
/* 서류를 새 창에 띄운다.
   예전에는 /report/... 로 그냥 창을 열었다. 현장 서버에는 그 주소가 있지만
   웹(정적 호스팅)에는 없어서 404 가 떴다 — 「미입고 발주서 출력」이 빈 창만
   띄우던 이유다. 지금은 /api/report/... 로 받아 와서 그 내용을 창에 쓴다.
   («데이터 추가» 등과 같은 길이라, 웹이든 현장 서버든 같은 코드로 동작한다)

   창은 누른 직후에 먼저 연다. 자료를 받아 온 뒤에 열면 브라우저가
   «사용자가 연 것이 아니다» 라고 보고 팝업을 막는다. */
async function openReport(key, extra){
  const q = qs() + (extra ? '&' + extra : '');
  const w = window.open('', '_blank');
  if(!w){ alert('팝업이 차단됐습니다. 이 사이트의 팝업을 허용해 주세요.'); return; }
  w.document.write('<!doctype html><meta charset="utf-8"><title>서류 준비 중</title>'
    + '<p style="font:14px/1.6 system-ui,sans-serif;color:#64748B;padding:28px">'
    + '서류를 만드는 중입니다…</p>');
  let r;
  try{
    r = await fetch('/api/report/' + encodeURIComponent(key) + '?' + q);
  }catch(e){
    /* 가로채는 층이 없는 환경 — 현장 서버의 원래 주소로 넘겨 준다 */
    w.location.href = '/report/' + encodeURIComponent(key) + '?' + q;
    return;
  }
  const text = await r.text();
  if(!r.ok){
    let msg = text;
    try{ msg = (JSON.parse(text).error) || text; }catch(e){}
    w.document.open();
    w.document.write('<!doctype html><meta charset="utf-8"><title>서류를 못 만들었습니다</title>'
      + '<div style="font:14px/1.7 system-ui,sans-serif;padding:32px;max-width:640px">'
      + '<h2 style="font-size:17px;margin:0 0 10px">서류를 만들지 못했습니다</h2>'
      + '<p id="m" style="color:#DC2626;white-space:pre-wrap"></p></div>');
    w.document.close();
    /* 오류 문구에 태그가 섞여 있을 수 있으니 textContent 로 넣는다 */
    const el = w.document.getElementById('m');
    if(el) el.textContent = msg;
    return;
  }
  w.document.open(); w.document.write(text); w.document.close();
}
let REPORTS = [];
async function loadReports(){
  try{ const r = await api('/api/reports'); REPORTS = r.templates || []; }
  catch(e){ REPORTS = []; }
  return REPORTS;
}
function reportBar(dataKind, extra){
  const list = REPORTS.filter(t => t.data === dataKind &&
                                  (!t.role || t.role === ME.role));
  if(!list.length) return '';
  return `<div class="panel" style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
    <b style="font-size:12.5px;color:var(--accent)">서류 출력</b>
    ${list.map(t=>`<button class="act" onclick="openReport('${t.key}'${extra?",'"+extra+"'":''})">
      ${t.title}</button>`).join('')}
    <span class="muted" style="font-size:11.5px;margin-left:auto">
      새 창에서 열립니다 · 인쇄 대화상자에서 PDF 저장 가능</span>
  </div>`;
}

boot();
</script>
