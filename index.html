<meta charset="utf-8">
<title>MCT MES — 공구 마모 관리</title>
<style>
  /* ═══════════════════════════════════════════════════════════════
     디자인 토큰 — 색·모서리·그림자를 여기서만 정한다.
     아래 규칙은 전부 이 변수를 쓰므로, 톤을 바꾸려면 이 블록만 고치면 된다.
     ═══════════════════════════════════════════════════════════════ */
  :root{
    --bg:#F7F9FB;        /* 화면 바탕 */
    --surface:#FFFFFF;   /* 카드·표 바탕 */
    --raise:#FCFDFE;     /* 살짝 띄운 곳 (표 머리글 등) */
    --line:#E7EAEE;      /* 기본 테두리 — 판·표처럼 «가만히 있는 것» */
    --line-2:#F1F4F7;    /* 표 안쪽 가로줄처럼 더 연한 선 */
    /* 누를 수 있는 칸(선택칸·입력칸·단추)의 테두리. 판 테두리와 같은 색을
       쓰면 «눌러도 되는 곳» 이 바탕에 묻혀 버린다. 한 단계 진하게 둔다. */
    --line-in:#AFBCCB;
    --line-in-2:#7E93AB;  /* 마우스를 올렸을 때 */
    --ink:#0F172A;       /* 본문 글자 */
    --ink-2:#334155;     /* 소제목 */
    --muted:#64748B;     /* 설명문 */
    --faint:#94A3B8;     /* 보조 표기 */
    /* ── 제일PMC 마크에서 뽑은 두 색. 화면 전체가 여기서 나온다.
          파랑 #004EA1 · 주황 #EC6E00 — 마크의 픽셀을 직접 집은 값이다.
          나머지 파생색(옅은 바탕·테두리·그래프)은 이 둘을 흐리게 한 것이라
          브랜드 색이 바뀌면 이 두 줄만 고치고 아래를 따라 맞추면 된다. */
    --accent:#004EA1;    /* PMC 파랑 — 브랜드 */
    --header:#004EA1;    /* 최상단 바 — 눌러야 하는 곳이라 색을 준다 */
    --header-2:#0A5CB4;  /* 상단바 위쪽 (아주 옅은 기울기) */
    --on-header:#BBD5EF; /* 상단바 위의 평상시 글자 */
    --accent-2:#00417F;  /* 눌렀을 때 */
    --accent-soft:#EDF3FC;
    --accent-line:#C4DAF1;
    --danger:#DC2626; --danger-soft:#FEF2F2; --danger-line:#FBD5D5;
    /* 그래프 — mes_dash.js 가 이 값을 읽어 쓴다.
       여기만 바꾸면 종합 탭 그래프 색이 같이 따라온다. */
    --chart-bar:#6E9FD6;   /* 막대 (강조색을 옅게) */
    --chart-area:#E6EFFA;  /* 잔선 아래 면 */
    --chart-grid:#F1F4F7;  /* 눈금선 */
    --chart-axis:#94A3B8;  /* 축 숫자 */
    --chart-label:#64748B; /* 축 이름 */
    /* 주의색도 마크의 주황으로. 파랑 옆에 노랑을 두면 남의 색이 하나 더
       늘어난다 — 마크가 이미 갖고 있는 주황을 쓰면 화면이 두 색으로 끝난다. */
    --warn:#EC6E00;   --warn-soft:#FFF5EB;   --warn-line:#FBD9B9;
    --warn-ink:#9A4700;  /* 주의 배경 위의 글자 — 밝은 주황은 흰 배경에서 안 읽힌다 */
    /* 재집계 진행창 — 여기만 일부러 어둡게 둔다 (터미널 출력이라) */
    --term-bg:#0F172A; --term-ink:#CBD5E1;
    --term-ok:#4ADE80; --term-warn:#FBBF24; --term-err:#FCA5A5;
    --ok:#059669;     --ok-soft:#ECFDF5;     --ok-line:#C7F0DF;
    --r:10px;          /* 카드 모서리 */
    --r-sm:7px;        /* 입력·버튼 모서리 */
    --sh:0 1px 2px rgba(15,23,42,.035), 0 2px 6px rgba(15,23,42,.035);
    --sh-2:0 4px 12px rgba(15,23,42,.07), 0 1px 3px rgba(15,23,42,.04);
    --ring:0 0 0 3px rgba(0,78,161,.16);

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard","Apple SD Gothic Neo","맑은 고딕","Malgun Gothic",
    system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  .hide{display:none!important}
  code{background:var(--raise);border:1px solid var(--line);padding:1px 6px;
    border-radius:5px;font-size:11.5px;
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}
  /* 숫자는 자릿수가 흔들리면 읽기 어렵다 — 고정폭으로 둔다 */
  .mono,.card .v,td,th,.gauge span,input[type=number]{
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  :focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}

  /* ── 로그인 */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 500px at 50% -10%, #EEF3FA 0%, var(--bg) 60%)}
  .lbox{background:var(--surface);padding:36px 38px;border-radius:14px;
    border:1px solid var(--line);box-shadow:var(--sh-2);width:380px}
  /* 로그인 상자는 흰 바탕이라 원본 색 마크를 쓴다 */
  .lbox .mark{width:121px;height:25px;margin-bottom:20px;
    background:var(--logo-c) left center/contain no-repeat}
  .lbox h1{font-size:19px;color:var(--ink);margin-bottom:5px;font-weight:650;
    letter-spacing:-.02em}
  .lbox .sub{color:var(--muted);font-size:12.5px;margin-bottom:24px}
  .lbox label{display:block;font-size:12px;color:var(--ink-2);margin:14px 0 6px;
    font-weight:550}
  .lbox input{width:100%;padding:10px 12px;border:1px solid var(--line-in);
    border-radius:var(--r-sm);font-size:13px;background:var(--surface);color:var(--ink);
    transition:border-color .12s,box-shadow .12s}
  .lbox input:hover{border-color:var(--line-in-2)}
  .lbox input:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
  .lbox button{width:100%;margin-top:22px;padding:11px;background:var(--accent);color:#fff;
    border:0;border-radius:var(--r-sm);font-size:14px;font-weight:600;cursor:pointer;
    transition:background .12s}
  .lbox button:hover{background:var(--accent-2)}
  .lerr{margin-top:15px;padding:11px 13px;border-radius:var(--r-sm);
    background:var(--danger-soft);border:1px solid var(--danger-line);color:var(--danger);
    font-size:12.5px;line-height:1.65;text-align:left}
  .hint{margin-top:18px;font-size:11.5px;color:var(--faint);text-align:center}

  /* ── 레이아웃 ───────────────────────────────────────────────
     왼쪽 기둥(메뉴) | 오른쪽 칸(기준 막대 + 본문).
     화면 높이를 100vh 로 못 박고 안쪽만 굴린다. 페이지 전체가 굴러가면
     표를 아래로 내릴 때 메뉴와 기준 막대까지 같이 사라진다 — 지금 무엇을
     기준으로 보고 있는지가 화면에서 없어지면 숫자를 잘못 읽게 된다. */
  #app{display:grid;grid-template-columns:268px 1fr;height:100vh;overflow:hidden}
  #col{display:flex;flex-direction:column;min-width:0;min-height:0}

  /* ── 왼쪽 기둥 ─────────────────────────────────────────────
     여기가 화면에서 «누르는 곳» 이 몰려 있는 유일한 자리라 색을 준다.
     본문과 같은 흰 바탕이면 어디를 눌러야 할지 눈에 안 들어온다. */
  #rail{display:flex;flex-direction:column;min-height:0;color:#fff;
    background:linear-gradient(180deg,var(--header-2) 0%,var(--header) 62%);
    box-shadow:1px 0 0 rgba(15,23,42,.14)}
  /* 마크는 파일 안에 박아 둔다(:root 의 --logo). 따로 그림 파일로 빼면
     web\ 에 복사하는 걸 잊는 순간 깨진 그림이 뜬다. */
  #rail .brand{flex:none;display:flex;align-items:center;gap:11px;
    padding:20px 20px 16px;white-space:nowrap}
  #rail .brand .mark{width:118px;height:24px;flex:none;
    background:var(--logo) left center/contain no-repeat}
  #rail .brand .nm{font-size:12.5px;font-weight:600;letter-spacing:.07em;
    color:rgba(255,255,255,.72);padding-left:11px;
    border-left:1px solid rgba(255,255,255,.28)}

  #rail nav{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
    padding:2px 12px 14px;display:flex;flex-direction:column;gap:2px}
  #rail nav::-webkit-scrollbar{width:6px}
  #rail nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:3px}
  /* 묶음 이름 — 열 개를 그냥 세우면 목록이지 메뉴가 아니다 */
  .ngrp{font-size:10.5px;font-weight:700;letter-spacing:.1em;
    color:rgba(255,255,255,.46);padding:16px 11px 6px}
  .ngrp:first-child{padding-top:4px}
  #rail nav button{display:flex;align-items:center;gap:11px;width:100%;
    background:transparent;border:0;color:rgba(255,255,255,.84);
    padding:10px 11px;border-radius:9px;font:inherit;font-size:13.5px;
    cursor:pointer;text-align:left;white-space:nowrap;
    transition:background .12s,color .12s}
  #rail nav button > span:first-of-type{flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis}
  #rail nav button:hover{background:rgba(255,255,255,.14);color:#fff}
  #rail nav button.on{background:#fff;color:var(--accent);font-weight:700;
    box-shadow:0 2px 7px rgba(15,23,42,.22)}
  /* 그림표는 선으로만 그린다 — 눌린 칸에서 색이 뒤집혀도 그대로 읽힌다 */
  .ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  #rail .rfoot{flex:none;display:flex;align-items:center;gap:10px;
    padding:13px 16px 16px;border-top:1px solid rgba(255,255,255,.15)}
  #who{flex:1;min-width:0;font-size:12px;color:rgba(255,255,255,.8);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #rail .out{flex:none;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.24);color:#fff;padding:6px 12px;
    border-radius:var(--r-sm);font:inherit;font-size:12px;cursor:pointer;
    transition:background .12s,border-color .12s}
  #rail .out:hover{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.4)}
  #rail :focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.55)}

  /* 좁은 화면 — 글자를 접고 그림표만 남긴다. 메뉴가 사라지지는 않는다.
     (칸마다 title 을 달아 두어 마우스를 올리면 이름이 뜬다) */
  /* 좁은 화면 — 기둥을 그림표만 남기고 접는다. 다만 마우스를 올리면
     제자리에서 다시 펴진다(본문 위로 덮는다). 접힌 채로 두면 탭에 딸린
     목록을 아예 못 쓰게 되는데, 그건 기능이 없어지는 것이다. */
  @media(max-width:1180px){
    #app{grid-template-columns:68px 1fr}
    #rail{position:fixed;top:0;bottom:0;left:0;width:68px;z-index:20;
      transition:width .14s ease}
    #rail:hover,#rail:focus-within{width:268px;
      box-shadow:6px 0 22px rgba(15,23,42,.22)}
    #rail .brand{justify-content:center;padding:16px 0 12px}
    #rail .brand .mark{width:32px;height:32px;background-image:var(--logo-sq)}
    #rail .brand .nm,.ngrp,#who,#side{display:none}
    #rail nav{padding:8px 10px 12px;gap:4px}
    #rail nav button{justify-content:center;padding:11px 0;gap:0}
    #rail nav button > span:first-of-type{display:none}
    #rail .rfoot{justify-content:center;padding:12px 8px}
    #rail .out{padding:6px 9px;font-size:11.5px}
    /* 펴졌을 때는 넓은 화면과 똑같이 */
    #rail:hover .brand,#rail:focus-within .brand{justify-content:flex-start;padding:20px 20px 16px}
    #rail:hover .brand .mark,#rail:focus-within .brand .mark{width:118px;height:24px;background-image:var(--logo)}
    #rail:hover .brand .nm,#rail:focus-within .brand .nm,
    #rail:hover .ngrp,#rail:focus-within .ngrp,
    #rail:hover #who,#rail:focus-within #who{display:block}
    #rail:hover .ngrp,#rail:focus-within .ngrp{padding:16px 11px 6px}
    #rail:hover #side:not(:empty),#rail:focus-within #side:not(:empty){display:block}
    #rail:hover nav,#rail:focus-within nav{padding:2px 12px 14px;gap:2px}
    #rail:hover nav button,#rail:focus-within nav button{justify-content:flex-start;padding:10px 11px;gap:11px}
    #rail:hover nav button > span:first-of-type,
    #rail:focus-within nav button > span:first-of-type{display:block}
    #rail:hover .rfoot,#rail:focus-within .rfoot{justify-content:flex-start;padding:13px 16px 16px}
  }

  /* ── 기준 선택 바 */
  /* 기준 막대는 늘 화면에 붙어 있다 — 아래 표를 굴려도 «무엇을 기준으로
     보고 있는지» 가 사라지면 안 된다. */
  #basis{flex:none;background:var(--raise);border-bottom:1px solid var(--line);
    padding:11px 30px;display:flex;align-items:center;gap:18px;row-gap:9px;flex-wrap:wrap}
  .bset{display:flex;align-items:center;gap:7px}
  .bset > span{font-size:12.5px;color:var(--muted);white-space:nowrap;font-weight:550}
  .bset select,.bset input[type=date]{padding:7px 10px;border:1px solid var(--line-in);
    border-radius:var(--r-sm);font:inherit;font-size:13px;background:var(--surface);
    color:var(--ink);cursor:pointer;
    box-shadow:0 1px 1px rgba(15,23,42,.04);
    transition:border-color .12s,box-shadow .12s}
  .bset select:hover,.bset input[type=date]:hover{border-color:var(--line-in-2);
    box-shadow:0 1px 3px rgba(15,23,42,.09)}
  .bset select:focus,.bset input[type=date]:focus{outline:none;border-color:var(--accent);
    box-shadow:var(--ring)}
  /* 기준 설명. 예전에는 margin-left:auto 로 오른쪽 끝에 붙이고 두 줄로 썼다.
     그러면 «구간·기준 수명…» 과 멀찍이 떨어져 읽는 눈이 한 번 건너뛰고,
     두 줄이라 막대가 선택칸보다 높아져 아래에 빈 띠가 생겼다.
     날짜 칸 바로 옆에 한 줄로 붙인다 — 막대 높이가 선택칸에 맞는다. */
  #bnote{font-size:12.5px;color:var(--muted);line-height:1.45;
    white-space:nowrap}
  #bnote b{color:var(--accent);font-weight:650}
  /* ── 한 줄 안내 띠 ─────────────────────────────────────────
     문단으로 깔아 두던 설명을 한 줄로 줄인 자리. 자세한 것은 «?» 뒤. */
  .note{background:var(--accent-soft);border:1px solid var(--accent-line);
    border-radius:var(--r-sm);padding:11px 15px;margin:0 0 15px;font-size:13.5px;
    color:var(--ink-2);line-height:1.6;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .note.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn-ink)}
  .note.danger{background:var(--danger-soft);border-color:var(--danger-line);color:#991B1B}
  .note b{font-weight:650}
  .lnk{border:1px solid currentColor;background:transparent;color:inherit;font:inherit;
    font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;cursor:pointer}
  .lnk:hover{background:rgba(255,255,255,.55)}
  .hint{font-weight:400;font-size:11.5px;color:var(--faint);margin-left:7px}

  /* ── 「?」 부가설명 단추 ─────────────────────────────────── */
  .help{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-in);
    background:var(--surface);color:var(--muted);font:600 11px/1 sans-serif;
    cursor:pointer;padding:0;flex:none;transition:all .12s}
  .help:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .helpbox{position:fixed;inset:0;background:rgba(15,23,42,.36);z-index:60;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .helpbox.hide{display:none}
  .hcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-2);
    max-width:520px;width:100%;padding:22px 24px 18px}
  .hcard h4{margin:0 0 11px;font-size:15px;color:var(--ink)}
  .hcard p{margin:0 0 9px;font-size:12.5px;color:var(--ink-2);line-height:1.75}
  .hcard .act{margin-top:6px}

  /* ── 원그래프 범례(색 뜻) ──────────────────────────────── */
  .dkey{display:flex;align-items:center;flex-wrap:wrap;gap:7px 16px;
    font-size:12px;color:var(--muted);line-height:1.5}
  .dkey span{display:flex;align-items:center;gap:5px}
  .dkey i{width:9px;height:9px;border-radius:2px}
  .dkey b{color:var(--ink);font-weight:650}
  .dkey .sep{width:1px;height:11px;background:var(--line-2);padding:0}
  .dkey.tp{padding-top:11px;border-top:1px solid var(--line-2)}
  /* ── 사용량 원그래프 ────────────────────────────────────────
     조각 크기 = 돌아간 시간, 조각 색 = 마모 단계.
     크고 빨간 조각이 지금 제일 급한 공구다.

     한 판에 다 넣는다 — 그림 / 목록 / 색 뜻이 예전엔 위아래로 쌓여 있어서
     이 판 하나가 화면 높이의 절반을 먹었고, 정작 아래의 공구 상세는 스크롤을
     내려야 보였다. 그림 옆의 빈 자리에 목록과 색 뜻을 넣어 판 높이를 그림
     높이(196px)로 묶는다. */
  /* 그림 | 목록. 목록을 여러 열로 펴 놓으면 네 줄이면 끝나 버려서, 그림
     높이만큼 아래가 통째로 비었다. 목록을 한 줄짜리 칸으로 세우고 넘치면
     그 칸만 굴러가게 하면 — 빈자리가 안 생기고, 남는 가로폭이 전부
     그림으로 간다. 그래서 그림이 커진다. */
  .donut{display:grid;grid-template-columns:1fr 358px;gap:22px;align-items:stretch}
  .dchart{position:relative;width:100%;max-width:340px;aspect-ratio:1/1;
    margin:0 auto;align-self:center}
  .dchart svg{width:100%;height:100%;display:block}
  .dside{display:flex;flex-direction:column;gap:9px;min-height:0}
  .dside .dkey{flex:none;margin-top:0;padding-top:9px;border-top:1px solid var(--line-2)}
  .dslice{cursor:pointer;transition:opacity .12s,transform .12s;transform-origin:100px 100px}
  .dslice:hover,.dslice:focus{outline:none;transform:scale(1.035)}
  .dslice.dim{opacity:.34}
  .dslice.sel{stroke:var(--ink);stroke-width:1.5;paint-order:stroke}
  .dmid{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 22px}
  .dmid b{font-size:30px;font-weight:700;color:var(--ink);line-height:1.1;letter-spacing:-.02em}
  .dmid b.lv1{color:var(--warn)} .dmid b.lv2{color:var(--danger)}
  .dmid span{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.35}
  .dmid span.sub{font-size:10.5px;color:var(--faint);margin-top:1px}
  /* 한 줄짜리. 넘치면 여기만 굴러간다 — min-height:0 이 있어야 판 높이를
     밀지 않고 제 안에서 줄어든다. */
  .dlegs{flex:1;min-height:0;overflow-y:auto;align-content:start;
    display:grid;grid-template-columns:1fr;gap:2px;padding-right:4px}
  .dlegs::-webkit-scrollbar{width:6px}
  .dlegs::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  /* 줄 바탕에 사용 비중만큼 색을 깔아 둔다(인라인 style 의 gradient).
     그래서 background-color 대신 box-shadow 로 눌린 표시를 준다 —
     색을 덮어쓰면 비중 막대가 사라진다. */
  .dleg{display:flex;align-items:center;gap:8px;padding:5px 9px;border:0;border-radius:7px;
    background-color:transparent;background-repeat:no-repeat;
    font:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer;
    text-align:left;width:100%;transition:box-shadow .1s,color .1s}
  .dleg:hover,.dleg.on{box-shadow:inset 0 0 0 1px var(--accent-line)}
  .rk{width:15px;flex:none;text-align:right;font-size:11px;font-weight:700;
    color:var(--faint);font-variant-numeric:tabular-nums}
  /* 지금 아래에서 펼쳐 보고 있는 공구 — 목록과 상세가 한 화면에 같이 있으니
     어느 줄이 아래 내용인지 표시가 없으면 둘이 따로 노는 것처럼 보인다 */
  .dleg.sel{box-shadow:inset 2px 0 0 var(--accent),inset 0 0 0 1px var(--accent-line)}
  .dleg.sel .nm{color:var(--accent);font-weight:700}
  .dleg.sel .rk{color:var(--accent)}
  .dleg i{width:9px;height:9px;border-radius:2px;flex:none}
  .dleg .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dleg .hr{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
  .dleg .we{width:50px;text-align:right;color:var(--ink);font-weight:650;
    font-variant-numeric:tabular-nums;font-size:12px}
  /* 90% 넘은 것은 목록에서도 색으로 튄다 — 그림만 보고 있지 않아도 보인다 */
  .dleg .we.lv1{color:var(--warn)} .dleg .we.lv2{color:var(--danger)}
  /* 판 제목 줄 — 오른쪽 끝에 「그 밖의 공구」 고르는 칸을 같이 둔다 */
  .phead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .phead h4{margin:0;flex:1;min-width:200px}
  .phead select{max-width:330px}

  /* ── 요약 숫자를 원그래프 왼쪽에 세로로 ──────────────────────
     넉 장짜리 가로 카드 줄이 그림 위에 따로 있었다. 숫자 네 개를 위해
     화면 한 줄(카드 높이 + 사이 여백)을 쓰는 셈이라, 그림 왼쪽의 빈
     자리로 내린다. 네 줄이 그림 높이(196px)를 똑같이 나눠 가지므로
     판 높이는 그림 높이 그대로다 — 숫자는 공짜로 얹힌 셈이 된다. */
  /* 왼쪽부터 센서 현황 · 요약 숫자 · 원그래프. 원그래프를 오른쪽으로 밀고
     폭을 줄였다 — 그림은 좁아져도 읽히지만, 「지금 값이 들어오고는 있나」는
     안 보이면 아예 모른다. */
  .dwrap{display:grid;grid-template-columns:248px 206px 1fr;gap:20px;align-items:stretch}

  /* ── 센서·반영 현황 ──────────────────────────────────────── */
  .senscol{display:flex;flex-direction:column;min-height:236px;
    border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
    padding:12px 14px 11px}
  .shead{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650;
    color:var(--ink);padding-bottom:9px;border-bottom:1px solid var(--line-2)}
  .shead b{margin-left:auto;font-size:12px;font-weight:650;color:var(--accent);
    font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  /* 뛰는 점 — 값이 들어오고 있다는 표시. 「지금 이 순간」 이 아니라는 것은
     옆의 시계와 «?» 가 말한다. */
  .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok);
    box-shadow:0 0 0 0 rgba(5,150,105,.55);animation:pulse 2.4s infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(5,150,105,.5)}
    70%{box-shadow:0 0 0 7px rgba(5,150,105,0)}
    100%{box-shadow:0 0 0 0 rgba(5,150,105,0)}}
  @media(prefers-reduced-motion:reduce){ .dot{animation:none} }
  .sline{display:flex;align-items:baseline;gap:7px;padding:6px 0;font-size:11.5px;
    color:var(--muted);border-bottom:1px solid var(--line-2)}
  .sline span{flex:none}
  .sline b{margin-left:auto;font-size:13px;font-weight:700;color:var(--ink);
    font-variant-numeric:tabular-nums}
  .sline em{font-style:normal;font-size:11px;color:var(--faint);flex:none}
  /* 신호 표는 칸 아래쪽에 붙인다 — 그림 높이에 맞춰 칸이 늘어나므로,
     위로 몰아 두면 아래가 통째로 빈다. */
  .sigs{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:10px;
    align-items:center;align-content:flex-end}
  .sig{display:inline-flex;align-items:center;gap:5px;font-size:11px;
    padding:3px 8px;border-radius:999px;white-space:nowrap;
    background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent)}
  .sig i{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
  .sig.off{background:var(--bg);border-color:var(--line);color:var(--faint)}
  .sigs .help{width:19px;height:19px;font-size:10.5px}
  .dwrap .donut{min-width:0}
  .sumcol{display:flex;flex-direction:column;min-height:236px;
    border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
  .srow{flex:1;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:0 15px;border-bottom:1px solid var(--line-2);min-width:0}
  .srow:last-child{border-bottom:0}
  .srow .k{font-size:12.5px;color:var(--muted);line-height:1.3}
  .srow .v{font-size:21px;font-weight:700;color:var(--ink);white-space:nowrap;
    letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .srow .v em{font-style:normal;font-size:12.5px;font-weight:500;
    color:var(--muted);margin-left:2px}
  .srow.ok{background:var(--ok-soft)}    .srow.ok .v{color:var(--ok)}
  .srow.warn{background:var(--warn-soft)} .srow.warn .v{color:var(--warn)}
  .srow.ok:first-child,.srow.warn:first-child{border-radius:var(--r) var(--r) 0 0}

  /* 좁아지면 센서 현황과 요약 숫자를 위아래로 접는다 — 셋을 다 세워 두면
     원그래프가 읽을 수 없을 만큼 얇아진다. */
  @media(max-width:1700px){ .dwrap{grid-template-columns:230px 190px 1fr;gap:16px} }
  /* 1500px 아래에서는 그림을 줄여 목록에 자리를 넘긴다. 그림이 커 봐야
     목록이 한 줄짜리로 떨어지면 판이 열 줄만큼 길어진다 — 그러면 아래
     공구 상세가 다시 접힌다. 시간은 줄에서 빼고 말풍선에만 남긴다. */
  @media(max-width:1500px){
    .donut{grid-template-columns:1fr 300px;gap:16px}
    .dchart{max-width:250px}
    .dmid b{font-size:25px} .dmid{padding:0 18px}
    .dleg .hr{display:none}
  }
  @media(max-width:1340px){
    .dwrap{grid-template-columns:230px 1fr;gap:16px}
    .senscol{grid-column:1;min-height:0}
    .sumcol{grid-column:1;min-height:0}
    .sumcol .srow{padding:9px 14px}
    .donut{grid-column:2;grid-row:1/3}
  }
  @media(max-width:900px){ .dwrap{grid-template-columns:1fr}
    .sumcol{min-height:0} .srow{padding:9px 13px}
    .donut{grid-template-columns:1fr} .dchart{margin:0 auto}
    .dside{min-height:0} .dside .dkey{margin-top:0} }
  /* 구간 혼합 경고는 띠로 두지 않는다. 화면 맨 위에서 한 줄을 통째로 먹는데
     늘 같은 문장이라 며칠이면 아무도 안 읽는다. 대신 기준 막대의 «구간» 옆
     «?» 단추가 ⚠ 로 바뀐다 — 자리를 안 먹고, 누르면 같은 설명이 나온다. */
  .help.mix{border-color:var(--warn-line);background:var(--warn-soft);
    color:var(--warn);font-size:11px}
  .help.mix:hover{border-color:var(--warn);background:var(--warn-soft);color:var(--warn-ink)}

  /* ── 메뉴에 딸린 목록 ──────────────────────────────────────
     누른 메뉴 칸 «바로 밑» 에 편다. 화면 가운데에 칸을 따로 두었을 때는
     어느 메뉴에 딸린 목록인지가 안 보였고, 본문 너비를 250px 씩 먹었다.
     길어지면 목록만 따로 굴러간다 — 아래쪽 메뉴(분석·자료)가 화면 밖으로
     밀려나면 메뉴 구실을 못 한다. */
  #side:empty{display:none}
  #side{display:block;margin:3px 0 6px;padding:4px 0 6px;
    max-height:42vh;overflow-y:auto;
    background:rgba(0,0,0,.16);border-radius:9px}
  #side::-webkit-scrollbar{width:6px}
  #side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:3px}
  #side h3{font-size:10px;color:rgba(255,255,255,.44);padding:0 12px;margin:11px 0 5px;
    letter-spacing:.08em;text-transform:uppercase;font-weight:700}
  #side h3:first-child{margin-top:4px}
  .item{padding:8px 12px 8px 14px;cursor:pointer;font-size:12.5px;
    color:rgba(255,255,255,.86);border-left:3px solid transparent;
    transition:background .12s,color .12s}
  .item:hover{background:rgba(255,255,255,.12);color:#fff}
  .item.on{background:rgba(255,255,255,.17);border-left-color:#fff;
    color:#fff;font-weight:700}
  .item .m{display:block;font-size:11px;color:rgba(255,255,255,.56);
    font-weight:400;margin-top:2px}
  /* 걸린 건이 0 인 규칙 — 흐리게 두되 누를 수는 있다. 눌러 보면 화면이
     「0건입니다」 라고 말해 준다. 아예 못 누르게 하면 규칙이 안 도는 건지
     걸린 게 없는 건지 알 길이 없다. */
  .item.zero{color:rgba(255,255,255,.52)}
  .item.zero .m{color:rgba(255,255,255,.38)}
  .item.muted{color:rgba(255,255,255,.5);cursor:default}
  main{padding:26px 34px 64px;overflow-y:auto;min-height:0}
  h2{font-size:24px;margin-bottom:5px;font-weight:700;letter-spacing:-.025em}
  .desc{color:var(--muted);font-size:13.5px;margin-bottom:20px;
    display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  /* 구간·기간처럼 «지금 무엇을 보고 있나» 를 적는 표. 화면마다 자리가
     같아서, 탭을 옮겨도 눈이 같은 곳을 본다. */
  .desc .pin{display:inline-flex;align-items:center;gap:6px;
    background:var(--accent-soft);border:1px solid var(--accent-line);
    color:var(--accent);border-radius:999px;padding:3px 11px;
    font-size:12.5px;font-weight:600}

  /* ── 요약 카드 */
  .cards{display:flex;gap:13px;flex-wrap:wrap;margin-bottom:18px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:15px 18px;min-width:152px;box-shadow:var(--sh);transition:border-color .12s}
  .card:hover{border-color:#D5DBE3}
  /* 누를 수 있는 카드. 커서와 테두리로만 알린다 — 값이 흔들리면 안 된다 */
  .card.click{cursor:pointer}
  .card.click:hover{border-color:var(--accent);background:var(--accent-soft)}
  .card .k{font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
  .card .v{font-size:27px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
  .card .u{font-size:13px;color:var(--faint);font-weight:500;margin-left:4px}
  .card.warn{background:var(--warn-soft);border-color:var(--warn-line)}
  .card.warn .v{color:var(--warn)}
  .card.ok{background:var(--ok-soft);border-color:var(--ok-line)}
  .card.ok .v{color:var(--ok)}
  .card.hl{background:var(--accent-soft);border-color:var(--accent-line)}
  .card.hl .v{color:var(--accent)}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:20px 22px;margin-bottom:18px;box-shadow:var(--sh)}
  .panel h4{font-size:15px;margin-bottom:15px;color:var(--ink);font-weight:700;
    letter-spacing:-.015em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  /* 제목 앞 짧은 막대 — 판이 여러 개 쌓였을 때 덩이의 시작이 눈에 띈다 */
  .panel > h4::before,.phead h4::before{content:'';width:3px;height:15px;flex:none;
    background:var(--accent);border-radius:2px;margin-right:2px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

  /* ── 「없습니다」 판 ───────────────────────────────────────
     빈 화면을 그냥 비워 두면 «안 뜬 건가» 하고 기다리게 된다.
     0건이라는 사실과 «무슨 기준으로 0인지» 를 같이 적는다. */
  .none{text-align:center;padding:26px 18px}
  .none .t{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:8px}
  .none .b{font-size:13px;color:var(--muted);line-height:1.75;
    max-width:620px;margin:0 auto}
  .none .b b{color:var(--ink);font-weight:650}

  /* ── 공구 상세: 그림 | 값 ─────────────────────────────────
     그림이 있는 공구만 왼쪽 칸이 생긴다(.haspic). 없는 공구에 빈 네모를
     띄우면 «사진이 깨졌나» 하고 한 번 더 보게 되므로 칸 자체를 안 만든다. */
  .tdet{display:block}
  .tdet.haspic{display:grid;grid-template-columns:132px 1fr;gap:18px;align-items:start}
  .tpic{background:var(--raise);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:9px;display:flex;align-items:center;justify-content:center;
    min-height:96px;overflow:hidden}
  .tpic img{max-width:100%;height:auto;display:block;
    image-rendering:-webkit-optimize-contrast}
  .tinfo{min-width:0}
  @media(max-width:1500px){ .tdet.haspic{grid-template-columns:112px 1fr;gap:14px} }
  @media(max-width:1100px){ .tdet.haspic{grid-template-columns:1fr}
    .tpic{max-width:260px} }
  @media(max-width:1100px){.grid2{grid-template-columns:1fr}}

  /* 판 제목 줄 오른쪽 — 찾기 · 정렬 · 고르기 한 벌.
     상위 10종은 그림에서 바로 누르면 되고, 이 칸은 나머지 57종을 찾을 때 쓴다. */
  .tpick{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
  .tpick input#tq{width:190px;padding:7px 11px;border:1px solid var(--line-in);
    border-radius:var(--r-sm);font:inherit;font-size:12.5px;background:var(--surface);
    color:var(--ink)}
  .tpick input#tq::placeholder{color:var(--faint)}
  .tpick select#tsort{padding:7px 9px;border:1px solid var(--line-in);

(function(){
  var mine = "381926ec06";
  function banner(v){
    if (document.getElementById('mes-stale')) return;
    var d = document.createElement('div');
    d.id = 'mes-stale';
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;'
      + 'background:#16304F;color:#fff;padding:11px 18px;font:13px/1.5 system-ui,sans-serif;'

      + 'Ctrl+Shift+R 로 새로고침해 주세요.</span>';
    var b = document.createElement('button');
    b.textContent = '지금 새로고침';
    b.style.cssText = 'margin-left:auto;background:#fff;color:#16304F;border:0;'
      + 'padding:6px 14px;border-radius:6px;font:inherit;font-weight:600;cursor:pointer';
    b.onclick = function(){ location.reload(true); };
    d.appendChild(b);
    (document.body || document.documentElement).appendChild(d);
  }
  function check(){
    fetch('version.txt?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.text() : null; })
      .then(function(v){
        if (!v) return;
        v = v.trim();
        if (!v || v === mine) return;             // 최신이다
        var tried = null;
        try { tried = sessionStorage.getItem('mes_tried'); } catch(e) {}
        if (tried === v) { banner(v); return; } // 새로고침해도 옛것이 온다 — 사람에게 넘긴다
        try { sessionStorage.setItem('mes_tried', v); } catch(e) {}
        location.reload();
      }).catch(function(){});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', check);
  else check();
})();
</script>

<script>
const $ = id => document.getElementById(id);
/* 사람이 적은 글을 화면에 넣을 때 반드시 거친다. 프로그램 이름처럼
   사용자가 직접 치는 값에 <  >  " 가 들어가면 화면이 깨지거나
   남의 태그가 실행된다. 숫자는 우리가 만든 것이라 안 거쳐도 된다. */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

async function doLogin(e){
  e.preventDefault();
  if(FILE_MODE){ lerr(NO_SERVER); return; }
  let r,j;
  try{
    r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:$('lid').value, pw:$('lpw').value})});
    j = await r.json();
  }catch(err){ lerr(NO_SERVER); return; }
  if(!r.ok){ lerr(j.error||'로그인 실패'); return; }
  ME=j.user; start();
}
async function doLogout(){ try{ await fetch('/api/logout',{method:'POST'}); }catch(e){} location.reload(); }
async function boot(){
  if(FILE_MODE){ lerr(NO_SERVER); return; }
  try{
    const j = await (await fetch('/api/me')).json();
    if(j.user){ ME=j.user; start(); }
  }catch(err){ lerr(NO_SERVER); }
}

function qs(){
  const p=new URLSearchParams();
  if(B.seg) p.set('seg',B.seg);
  if(B.life) p.set('life',B.life);
  if(B.week) p.set('week',B.week);
  if(B.anchor) p.set('anchor',B.anchor);
  return p.toString();
}
const api = p => fetch(p + (p.includes('?')?'&':'?') + qs()).then(r=>r.json());

function setBasis(){
  B.seg=$('b_seg').value; B.life=$('b_life').value;

function fillBasisBar(b){
  BASIS=b;
  const sel=(el,items,val)=>{
    el.innerHTML=items.map(i=>`<option value="${i.v}" ${String(i.v)===String(val)?'selected':''}>${i.t}</option>`).join('');
  };
  sel($('b_seg'), b.segments.map(s=>({v:s.key,t:`${s.label} — ${s.tools}종 · ${s.hours.toFixed(1)}h`})), b.segment);
  sel($('b_life'), b.life_options.map(v=>({v,t:v+'일'})), b.life_days);
  sel($('b_week'), b.week_options.map(w=>({v:w.v,t:`${w.v}h${w.note?' — '+w.note:''}`})), b.week_hours);
  sel($('b_anchor'), b.anchor_options.map(a=>({v:a.v,t:a.label})), b.anchor);
  B.seg=b.segment; B.life=b.life_days; B.week=b.week_hours; B.anchor=b.anchor;

  // 한 줄로 쓴다. 두 줄이면 기준 막대가 선택칸보다 높아져 아래에 빈 띠가 생긴다.
  $('bnote').innerHTML =
    `기준 <b>${b.life_days}일 = 절삭 ${num(Math.round(b.life_cut_hours))}h</b> · 하루 ${b.day_hours.toFixed(2)}h` +
    ` · 관측 ${b.observed_hours}h = 기준 수명의 <b>${(100*b.observed_hours/b.life_cut_hours).toFixed(2)}%</b>`;

  // 구간 혼합 표시. 예전에는 화면 맨 위에 띠를 깔았는데, 늘 같은 문장이
  // 한 줄을 먹고 있어서 며칠이면 아무도 안 읽는다. 「구간」 옆 «?» 를
  // ⚠ 로 바꿔 두고, 누르면 같은 설명이 나오게 했다 — 자리를 안 먹는다.
  const hs=$('h_seg'), mix = b.segment==='all';
  if(hs){
    hs.classList.toggle('mix', mix);
    hs.textContent = mix ? '⚠' : '?';
    hs.title = mix ? `구간 혼합 — ${b.switch} 부품 전환. 눌러서 자세히`
                   : '구간이란';
  }
}

async function start(){
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('who').textContent = `${ME.name} (${ME.role==='manager'?'관리자':'작업자'})`;
  fillBasisBar(await api('/api/basis'));
  await loadReports();
  await reload();
}
async function reload(){
  TOOLS = await api('/api/tools');
  PROGS = await api('/api/programs');
  if(!TOOLS.find(t=>t.tool===SEL.tool)) SEL.tool = TOOLS[0]?.tool ?? null;
  if(!PROGS.progs.find(p=>p.prog===SEL.prog)) SEL.prog = null;
  if(!PROGS.mains.find(m=>m.main===SEL.main)) SEL.main = null;
  render();
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>goTab(b.dataset.tab));

/* 화면 안에서 다른 탭으로 건너뛸 때 쓴다. 왼쪽 기둥의 선택 표시도 같이
   옮겨 준다 — 이걸 빠뜨리면 내용은 바뀌었는데 메뉴는 그대로라 길을 잃는다. */
function goTab(name){
  TAB = name;
  document.querySelectorAll('nav button').forEach(x=>
    x.classList.toggle('on', x.dataset.tab===name));
  /* 굴러가는 것은 페이지가 아니라 본문 칸이다(레이아웃이 100vh 고정).
     window.scrollTo 를 부르면 아무 일도 안 일어나, 새 탭이 아래쪽부터 보인다. */
  const top = el => { if(el) el.scrollTop = 0; };
  top($('main')); top($('side'));
  render();
}

/* 탭에 딸린 목록을 «지금 눌린 메뉴 칸 바로 밑» 으로 옮긴다.
   목록을 화면 가운데 칸에 따로 두면 어느 메뉴에 딸린 것인지가 안 보인다.
   메뉴 밑에 들어가 있으면 「제조관리를 눌렀더니 그 밑에 프로그램이 폈다」로
   읽힌다 — 누르는 곳과 결과가 붙어 있어야 한다.

   눌린 칸이 무엇이든 «그 칸 밑» 으로 옮긴다. 「종합」처럼 다른 파일
   (mes_dash.js)이 붙인 버튼도 자기 목록(주차 요약)을 쓰기 때문이다.
   예전에는 탭이 아니면 비우기만 하고 자리를 안 옮겼는데, 그러면 종합이
   채워 넣은 목록이 직전에 눌렀던 메뉴(질의 등) 밑에 그대로 남았다. */
function placeSide(){
  const side = $('side'); if(!side) return;
  const on = document.querySelector('nav button.on');
  if(!on){ side.innerHTML=''; return; }
  if(on.nextSibling !== side) on.parentNode.insertBefore(side, on.nextSibling);
}
window.placeSide = placeSide;

     pin 에 '' 를 주면 구간 표를 아예 안 붙인다 (구간과 무관한 화면). */
function pageHead(title, note, pin){
  const b = BASIS || {};
  const p = pin !== undefined ? pin
    : (b.segment_label ? b.segment_label + (b.segment_period ? ' · ' + b.segment_period : '') : '');

    ? `<div class="desc">${p ? `<span class="pin">${esc(p)}</span>` : ''}${note || ''}</div>`
    : '');
}

const toolImg = t => TOOLIMG[t] || null;

function helpBtn(key){
  const h = HELP[key];
  if(!h) return '';
  return `<button class="help" type="button" aria-label="${esc(h[0])} 설명"
    title="${esc(h[0])}" onclick="openHelp('${key}')">?</button>`;
}

function openHelp(key){
  const h = HELP[key]; if(!h) return;
  let box = $('helpbox');
  if(!box){
    box = document.createElement('div');
    box.id = 'helpbox'; box.className = 'helpbox hide';
    document.body.appendChild(box);
    box.addEventListener('click', e => { if(e.target === box) closeHelp(); });
  }
  box.innerHTML = `<div class="hcard">
    <h4>${esc(h[0])}</h4>
    ${h[1].split('\n').map(t => `<p>${esc(t)}</p>`).join('')}
    <button class="act sec" onclick="closeHelp()">닫기</button>
  </div>`;
  box.classList.remove('hide');
}
function closeHelp(){ const b = $('helpbox'); if(b) b.classList.add('hide'); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeHelp(); });

   조각 «크기» 는 그 공구가 실제로 돈 시간, 조각 «색» 은 마모 단계다.
   그래서 «크고 빨간 조각» 이 지금 제일 급한 공구가 된다 — 설명을
   읽지 않아도 눈이 먼저 찾는다.

   라이브러리를 안 쓴다. 조각 하나에 <path> 하나씩 그리고, 마우스를
   올리면 가운데 글자만 바꾼다. 붙일 것이 없으니 오프라인에서도 돈다. */
const WLV = w => w >= 100 ? 2 : w >= 90 ? 1 : 0;      // 0 보통 · 1 주의 · 2 교체
const WCOL = ['var(--chart-bar)', 'var(--warn)', 'var(--danger)'];

/* 조각 진하기 — 경보선(90·100%)은 색으로 못박고, 그 아래는 «이 그림 안에서»
   상대적으로 얼마나 닳았나를 진하기로 낸다.
   처음에는 0~90% 를 진하기로 폈는데, 지금 자료는 8~28% 에 몰려 있어
   열 조각이 죄다 비슷한 연파랑이 됐다. 눈에 안 갈리면 없는 것과 같다.
   그래서 «그림에 실제로 들어간 값의 범위» 로 편다. 대신 이건 절대 위험도가
   아니라 상대 비교라는 것을 범례와 «?» 에 분명히 적는다. */
function wden(w, lo, hi){
  if(!(hi > lo)) return 0.72;
  return 0.30 + 0.70 * Math.min(Math.max(((w || 0) - lo) / (hi - lo), 0), 1);
}

/* sel = 지금 아래 상세에 펼쳐 둔 공구 번호. 목록에서 그 줄을 짚어 준다 —
   그림·목록·상세가 한 화면에 같이 있으니 어느 줄이 아래 내용인지 보여야 한다. */
/* ═════ 공구 고르기 — 찾기와 정렬 ═════════════════════════════
   67종을 한 줄 목록으로만 두면 「T43 이 어디 있지」 를 눈으로 훑게 된다.
   글자로 찾고, 무엇을 위로 올릴지 고를 수 있게 한다.
   찾기는 화면 전체를 다시 그리지 않고 목록 속만 갈아 끼운다 — 다시 그리면
   글자를 한 자 칠 때마다 입력칸에서 커서가 튕겨 나간다. */
let TSEL_Q = '', TSEL_SORT = 'wear';
const TSORT = {
  wear:  ['마모율 높은 순',   (a,b)=> (b.wear ||0) - (a.wear ||0)],
  hours: ['사용시간 많은 순', (a,b)=> (b.hours||0) - (a.hours||0)],
  no:    ['공구 번호 순',     (a,b)=> (a.tool ||0) - (b.tool ||0)],
  name:  ['이름 순',          (a,b)=> String(a.name||'').localeCompare(String(b.name||''),'ko')],
};
/* 찾는 말이 번호에도 이름에도 걸리게 한다. 「33」 과 「T33」 과 「드릴」 이
   모두 통해야 사람이 외운 대로 칠 수 있다. */
function toolHits(){
  const q = TSEL_Q.trim().toLowerCase();
  const ok = x => !q
    || String(x.tool).includes(q)
    || ('t' + x.tool).includes(q)
    || String(x.name || '').toLowerCase().includes(q);
  return (TOOLS || []).filter(ok).slice().sort(TSORT[TSEL_SORT][1]);
}
function toolOptions(){
  const list = toolHits();
  if(!list.length)
    return `<option value="">찾는 공구가 없습니다 — 「${esc(TSEL_Q)}」</option>`;
  const head = TSEL_Q.trim()
    ? `<option value="" disabled>${list.length}종 찾음</option>` : '';
  return head + list.map(x=>`<option value="${x.tool}" ${x.tool===SEL.tool?'selected':''}>`
    + `T${x.tool} · ${esc(x.name)} — 마모 ${f2(x.wear)}% · ${f2(x.hours)}h</option>`).join('');
}
function tfind(v){
  TSEL_Q = v;
  const el = $('tsel'); if(el) el.innerHTML = toolOptions();
}
function tsort(v){ TSEL_SORT = v; tfind(TSEL_Q); }
/* 찾기칸에서 Enter — 맨 위에 걸린 공구로 바로 간다 */
function tfirst(){
  const first = toolHits()[0];
  if(first){ SEL.tool = first.tool; render(); }
}

/* ═════ 센서·반영 현황 ════════════════════════════════════════
   «지금 이 순간» 값은 없다. 주 단위로 받은 CSV 를 집계해 올리는 구조라서,
   화면이 아는 가장 최근 시각은 «집계를 만든 때» 다. 그래서 거짓말 대신
   그 시각으로부터 흐른 시간을 1초마다 세어 보여 준다 — 화면은 살아
   움직이고, 보는 사람은 «얼마나 묵은 값인지» 를 그대로 알게 된다.

   신호 목록도 「수집 중」 이라고 뭉뚱그리지 않고, 실제로 몇 행이 들어왔는지
   (health 의 n) 를 세어 들어온 것과 안 들어온 것을 갈라 적는다. */
let SENS_T = null;

function sensPanel(b, ov, hs){
  const dr = b.date_range || {};
  const rows = (ov.days || []).reduce((s, d) => s + (d.rows || 0), 0);
  const man = v => v >= 1e8 ? (v/1e8).toFixed(1)+'억'
                 : v >= 1e4 ? Math.round(v/1e4).toLocaleString()+'만' : num(v);

  /* 신호를 사람이 부르는 이름으로 묶는다. 화면에 cur_r · servo_x 를 그대로
     적으면 이 일을 모르는 관리자는 한 줄도 못 읽는다. */
  const GROUP = [
    ['전류 R·S·T',   ['cur_r','cur_s','cur_t']],
    ['3상 불평형',   ['imbalance']],
    ['서보 부하 X·Y·Z', ['servo_x','servo_y','servo_z']],
    ['진동 주파수',  ['freq_x','freq_y','freq_z']],
    ['주축 부하율',  ['spindle_load']],
    ['온도·습도',    ['vib_temp','uyeg_temp','uyeg_humi']],
  ];
  const st = (hs && hs.available && hs.stats) ? hs.stats : null;
  const sigs = st ? GROUP.map(([nm, keys]) => {
    const n = keys.reduce((s,k) => Math.max(s, (st[k] && st[k].n) || 0), 0);
    return {nm, n, on: n > 0};
  }) : [];
  /* 안 들어오는 것도 같이 적는다. 빠진 것을 안 적으면 «다 들어온다» 로 읽힌다 */
  const OFF = ['알람 코드', '진동 첨도', '생산 수량', '고정 사이클 G코드'];

  return `<div class="senscol">
    <div class="shead"><i class="dot"></i>센서 수집
      <b id="since" title="집계를 만든 때부터 흐른 시간">—</b></div>
    <div class="sline"><span>마지막 반영</span>
      <b>${esc((b.built||'').slice(5,16) || '-')}</b></div>
    <div class="sline"><span>자료 기간</span>
      <b>${dr.count||0}일</b><em>${esc((dr.min||'').slice(5))}~${esc((dr.max||'').slice(5))}</em></div>
    <div class="sline"><span>이 구간 행</span><b>${man(rows)}</b><em>행</em></div>
    <div class="sigs">
      ${sigs.map(g=>`<span class="sig ${g.on?'on':'off'}" title="${num(g.n)}행">
        <i></i>${g.nm}</span>`).join('')}
      ${OFF.map(n=>`<span class="sig off" title="이 설비에서 값이 안 들어옵니다"><i></i>${n}</span>`).join('')}
      ${helpBtn('sensor')}
    </div>
  </div>`;
}

/* 1초마다 «집계를 만든 때로부터» 를 다시 적는다. 화면을 다시 그릴 때마다
   앞 시계를 반드시 끈다 — 안 끄면 탭을 옮길 때마다 시계가 하나씩 쌓인다. */
function tickSens(built){
  if(SENS_T){ clearInterval(SENS_T); SENS_T = null; }
  const el = $('since'); if(!el) return;
  const t0 = built ? new Date(String(built).replace(' ', 'T')).getTime() : NaN;
  if(!(t0 > 0)){ el.textContent = '시각 없음'; return; }
  const draw = () => {
    const el2 = $('since');
    if(!el2){ clearInterval(SENS_T); SENS_T = null; return; }   // 화면이 바뀌었다
    let s = Math.max(0, Math.floor((Date.now() - t0) / 1000));
    const d = Math.floor(s/86400); s -= d*86400;
    const h = Math.floor(s/3600);  s -= h*3600;
    const m = Math.floor(s/60);    s -= m*60;
    const p = v => String(v).padStart(2,'0');
    el2.textContent = (d?d+'일 ':'') + `${p(h)}:${p(m)}:${p(s)} 전`;
  };
  draw();
  SENS_T = setInterval(draw, 1000);
}

function donutTop(tools, n, sel){
  n = n || 10;
  const used = tools.filter(t => (t.hours || 0) > 0)
                    .sort((a, b) => b.hours - a.hours);
  if(!used.length) return '<div class="muted" style="padding:20px 0">돌아간 공구가 없습니다</div>';

  /* 상위 n 종«만» 그린다. 「그 외」를 한 조각으로 넣어 보니 그 회색 덩어리가
     44% 를 차지해 정작 보여 주려던 열 개가 안 보였다. 대신 이 열 종이 전체의
     몇 %인지는 그림 아래에 글로 적는다 — 숨기지 않고 자리만 옮긴 것이다. */
  const top = used.slice(0, n);
  const rest = used.slice(n);
  const restH = rest.reduce((s, t) => s + t.hours, 0);
  const allH = used.reduce((s, t) => s + t.hours, 0);
  const all = top.reduce((s, t) => s + t.hours, 0);

  const ws = top.map(t => t.wear || 0);
  const lo = Math.min(...ws), hi = Math.max(...ws);
  const seg = top.map(t => ({ tool: t.tool, name: t.name, h: t.hours,
                              wear: t.wear, cls: t.cls,
                              col: WCOL[WLV(t.wear)],
                              op: WLV(t.wear) ? 1 : wden(t.wear, lo, hi),
                              lv: WLV(t.wear) }));

  const R = 88, r = 54, C = 100;      // 바깥·안쪽 반지름, 중심
  let a0 = -Math.PI / 2;              // 12시부터 시계방향
  const arcs = seg.map((g, i) => {
    const a1 = a0 + (g.h / all) * Math.PI * 2;
    const big = (a1 - a0) > Math.PI ? 1 : 0;
    const P = (rad, ang) => [C + rad * Math.cos(ang), C + rad * Math.sin(ang)];
    const [x1, y1] = P(R, a0), [x2, y2] = P(R, a1);
    const [x3, y3] = P(r, a1), [x4, y4] = P(r, a0);
    a0 = a1;
    const lab = g.tool == null ? g.name : `T${g.tool} ${g.name}`;
    return `<path d="M${x1} ${y1} A${R} ${R} 0 ${big} 1 ${x2} ${y2}
             L${x3} ${y3} A${r} ${r} 0 ${big} 0 ${x4} ${y4} Z"
      fill="${g.col}" fill-opacity="${g.op.toFixed(3)}"
      class="dslice${g.tool != null && g.tool === sel ? ' sel' : ''}" tabindex="0" role="button"
      data-i="${i}" data-tool="${g.tool == null ? '' : g.tool}"
      data-lab="${esc(lab)}" data-h="${g.h.toFixed(2)}"
      data-pct="${(100 * g.h / all).toFixed(1)}"
      data-wear="${g.wear == null ? '' : g.wear.toFixed(2)}"
      data-lv="${g.lv}"><title>${esc(lab)} — ${g.h.toFixed(1)}h${
        g.wear == null ? '' : ` · 마모 ${g.wear.toFixed(2)}%`}</title></path>`;
  }).join('');

  /* 목록 한 줄 = 순위 · 색 · 이름 · 시간 · 마모율.
     줄 바탕을 사용 비중만큼 칠한다 — 막대를 따로 그리면 줄 높이가 두 배가
     되는데, 바탕으로 깔면 높이를 안 먹고도 «누가 큰가» 가 한눈에 보인다.
     그림을 못 보는 상황(작은 화면·흑백 인쇄)에서도 목록만으로 읽힌다. */
  const legend = seg.map((g, i) => {
    const pct = 100 * g.h / all;
    const sel_ = g.tool != null && g.tool === sel;
    return `<button class="dleg${sel_ ? ' sel' : ''}" data-i="${i}"
      aria-pressed="${sel_}" title="${esc(g.name)} — 절삭 ${g.h.toFixed(2)}h · 사용량의 ${pct.toFixed(1)}%${
        g.wear == null ? '' : ` · 마모 ${g.wear.toFixed(2)}%`}"
      style="background-image:linear-gradient(90deg,var(--accent-soft) ${pct.toFixed(1)}%,transparent ${pct.toFixed(1)}%)"
      ${g.tool == null ? '' : `onclick="SEL.tool=${g.tool};render()"`}>
      <span class="rk">${i + 1}</span>
      <i style="background:${g.col};opacity:${g.op.toFixed(3)}"></i>
      <span class="nm">${g.tool == null ? esc(g.name) : 'T' + g.tool + ' ' + esc(g.name)}</span>
      <span class="hr">${g.h.toFixed(1)}h</span>
      <span class="we lv${g.lv}">${g.wear == null ? '' : g.wear.toFixed(1) + '%'}</span>
    </button>`;
  }).join('');

  /* 가운데 글자. 고른 공구가 이 그림 안에 있으면 그것을 먼저 적는다 —
     마우스를 떼면 늘 「10종」 으로 돌아가 버리면, 방금 무엇을 골랐는지
     그림에서는 알 수가 없다. */
  const cur = seg.find(g => g.tool != null && g.tool === sel);
  const mid = cur
    ? `<b class="${cur.lv ? 'lv' + cur.lv : ''}">${cur.wear == null ? cur.h.toFixed(1) + 'h' : cur.wear.toFixed(1) + '%'}</b>`
      + `<span>T${cur.tool} ${esc(cur.name)}</span>`
      + `<span class="sub">${cur.h.toFixed(1)}h · 사용량의 ${(100 * cur.h / all).toFixed(1)}%</span>`
    : `<b>${top.length}종</b><span>가장 많이 쓴 공구</span>`;

  /* 색 뜻과 「이 열 종이 전체의 몇 %인가」를 그림 «아래» 가 아니라 «옆»
     아래쪽에 붙인다. 그림 옆은 어차피 비는 자리고, 아래에 쌓으면 그만큼
     화면이 밀려 정작 중요한 공구 상세가 접힌다. */
  const key = `<div class="dkey">
    <span><i style="background:var(--chart-bar);opacity:.3"></i><i
      style="background:var(--chart-bar);opacity:.65;margin-left:-2px"></i><i
      style="background:var(--chart-bar);margin-left:-2px"></i>진할수록 많이 닳음
      (${lo.toFixed(1)}~${hi.toFixed(1)}%)</span>
    <span><i style="background:var(--warn)"></i>주의 90%↑</span>
    <span><i style="background:var(--danger)"></i>교체 100%↑</span>
    <span class="sep"></span>
    <span>이 ${top.length}종이 전체 절삭의 <b>${(100 * all / allH).toFixed(0)}%</b>${
      rest.length ? ` · 나머지 ${rest.length}종 ${restH.toFixed(1)}h` : ''}</span>
    ${typeof helpBtn === 'function' ? helpBtn('donut') : ''}</div>`;

  return `<div class="donut">
    <div class="dchart">
      <svg viewBox="0 0 200 200" role="img" aria-label="공구별 사용량">
        ${arcs}
        <circle cx="100" cy="100" r="${r - 1}" fill="var(--surface)"></circle>
      </svg>
      <div class="dmid" id="dmid">${mid}</div>
    </div>
    <div class="dside">
      <div class="dlegs">${legend}</div>
      ${key}
    </div>
  </div>`;
}

/* 마우스를 올리면 가운데 글자를 바꾼다. 조각마다 말풍선을 띄우면
   화면이 어지럽고, 가운데는 어차피 비어 있다. */
function bindDonut(){
  const mid = $('dmid'); if(!mid) return;
  const base = mid.innerHTML;
  const show = el => {
    const w = el.dataset.wear;
    mid.innerHTML = `<b class="${w === '' ? '' : 'lv' + el.dataset.lv}">${
        w === '' ? el.dataset.h + 'h' : w + '%'}</b>` +
      `<span>${esc(el.dataset.lab)}</span>` +
      `<span class="sub">${el.dataset.h}h · 사용량의 ${el.dataset.pct}%</span>`;
    document.querySelectorAll('.dleg').forEach(b =>
      b.classList.toggle('on', b.dataset.i === el.dataset.i));
    document.querySelectorAll('.dslice').forEach(p =>
      p.classList.toggle('dim', p.dataset.i !== el.dataset.i));
  };
  const clear = () => {
    mid.innerHTML = base;
    document.querySelectorAll('.dleg').forEach(b => b.classList.remove('on'));
    document.querySelectorAll('.dslice').forEach(p => p.classList.remove('dim'));
  };
  document.querySelectorAll('.dslice').forEach(p => {
    p.addEventListener('mouseenter', () => show(p));
    p.addEventListener('focus', () => show(p));
    p.addEventListener('click', () => { if(p.dataset.tool){ SEL.tool = +p.dataset.tool; render(); } });
  });
  document.querySelectorAll('.dleg').forEach(b => {
    b.addEventListener('mouseenter', () =>
      show(document.querySelector(`.dslice[data-i="${b.dataset.i}"]`)));
  });
  const box = document.querySelector('.donut');
  if(box) box.addEventListener('mouseleave', clear);
}


async function renderDash(){
  const ov = await api('/api/overview');
  const b = ov.basis; fillBasisBar(b);
  /* 센서 현황은 있으면 좋은 것이지 없으면 화면이 안 떠서는 안 되는 값이다 —
     못 읽어도 대시보드는 그대로 뜨게 둔다. */
  let hs = null;
  try{ hs = await api('/api/health'); }catch(e){ hs = null; }

  /* 대시보드에는 딸린 목록을 안 둔다. 여기 있던 「메인 프로그램 / 세부
     프로그램」 목록은 이 화면의 숫자를 하나도 거르지 않았다 — 눌러 봐야
     제조관리로 건너뛰는 지름길일 뿐이었고, 같은 목록이 제조관리 메뉴
     밑에 그대로 있다. 목록을 비우면 대시보드가 화면 전체를 쓴다. */
  $('side').innerHTML = '';

  const t = TOOLS.find(x=>x.tool===SEL.tool) || TOOLS[0];
  const det = t ? await api('/api/tool/'+t.tool) : null;
  DASH_TOOL = det ? det.tool : null;     // 「교체 처리」가 이 값을 쓴다
  const s = ov.summary;

  // 사용량 상위 — 급한 순서가 아니라 «많이 쓴 순서» 다. 관리자가 먼저
  // 보고 싶은 것은 「무엇이 제일 많이 도는가」 이고, 그중 빨간 것이 급한 것이다.
  const busy = TOOLS.filter(x => (x.hours || 0) > 0)
                    .sort((a, b2) => b2.hours - a.hours).slice(0, 10);
  const hot = TOOLS.filter(x => x.wear >= 90).sort((a, b2) => b2.wear - a.wear);

  $('main').innerHTML = `
    ${pageHead('대시보드', '지금 무엇이 급한지 · 무엇이 제일 많이 도는지')}
    ${s.anchor_live===false?`<div class="note warn">
      <b>기준 공구가 이 구간에서 안 돌았습니다</b> — 「기준 대비 진행」이 멈춰 있습니다.

/* 그림 색은 위 :root 에서 읽는다. 코드에 박아 두면 화면 색을 바꿔도
   이 그래프만 옛 색으로 남는다. mes_dash.js 도 같은 방식이다. */
function cssVar(name, dflt){
  try{ const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
       return v||dflt; }catch(e){ return dflt; }
}
function drawDays(days){
  const cv=$('cv'); if(!cv) return;
  const ctx=cv.getContext('2d'), w=cv.width=cv.clientWidth*2, h=cv.height=300;
  ctx.clearRect(0,0,w,h);
  const cBar=cssVar('--accent','#004EA1'), cNone=cssVar('--line','#E7EAEE'),
        cLab=cssVar('--chart-label','#64748B'), cVal=cssVar('--ink','#0F172A');
  const mx=Math.max(...days.map(d=>d.cut_h),1), n=days.length, bw=w/n*0.6;
  days.forEach((d,i)=>{
    const x=(i+0.5)*w/n, bh=d.cut_h/mx*(h-50);
    ctx.fillStyle= d.cut_h>0?cBar:cNone;
    /* 모서리를 살짝 굴린다. 옛 브라우저에는 roundRect 가 없으니 그때는 각지게. */
    if(ctx.roundRect){ ctx.beginPath();
      ctx.roundRect(x-bw/2,h-30-bh,bw,Math.max(bh,2),Math.min(6,bw/3)); ctx.fill(); }
    else ctx.fillRect(x-bw/2,h-30-bh,bw,bh);
    if(n<=25){ ctx.fillStyle=cLab; ctx.font='18px sans-serif'; ctx.textAlign='center';
      ctx.fillText(d.date.slice(5),x,h-8);
      if(d.cut_h>0){ ctx.fillStyle=cVal; ctx.fillText(d.cut_h.toFixed(1),x,h-36-bh); } }
  });
}

        <div class="row"><span>절삭 시간</span><span class="mono">${f2(p.hours||0)} h</span></div>
        <div class="row"><span>마모 기여</span><span class="mono">${f3(p.wear||0)} %</span></div>
        <input id="pnm" maxlength="40" placeholder="예) 리어커버 황삭 · 밸브 탭 가공"
          value="${esc(p.name||'')}" style="margin-top:12px">
        <div style="font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:9px">
          빈 칸으로 저장하면 이름을 지웁니다.
          이름은 집계본과 따로 저장돼서 <b>재집계해도 안 날아갑니다.</b>
        </div>
      </div>
      <div class="mfoot">
        <button class="act gray" onclick="closeOrder()">취소</button>
        <button class="act" onclick="saveProgName('${esc(prog)}')">저장</button>
      </div>
    </div>`;
  setTimeout(()=>{ const i=$('pnm'); if(i){ i.focus(); i.select(); } }, 30);
}

async function saveProgName(prog){
  const name = ($('pnm')||{}).value||'';
  const r = await fetch('/api/progname',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({prog, name})});
  const j = await r.json();
  if(!r.ok){ alert((j.error||'저장 실패') + (j.hint?('\n\n'+j.hint):'')); return; }
  closeOrder();
  PROGS = await api('/api/programs');   // 이름만 다시 받아 온다
  render();
}

// ═════ 영업관리
/* 선택한 제품(메인 프로그램). null 이면 전체 화면이다. */
let SALES_SEL = null;
function pickProduct(main){ SALES_SEL = (SALES_SEL===main? null : main); renderSales(); }

async function renderSales(){
  const s = await api('/api/sales');
  const b = s.basis;
  const nameOf = m => {
    const nm=((PROGS&&PROGS.mains)||[]).find(x=>x.main===m.main);
    return nm&&nm.name ? esc(nm.name) : 'O'+m.main;
  };
  /* 선택한 제품이 지금 구간에 없으면(구간을 바꾼 경우) 조용히 전체로 돌린다 */
  if(SALES_SEL && !s.mains.some(m=>m.main===SALES_SEL)) SALES_SEL = null;

  $('side').innerHTML = `<h3>제품 (메인 프로그램)</h3>` +
    `<div class="item ${SALES_SEL?'':'on'}" onclick="SALES_SEL=null;renderSales()">전체
      <span class="m">${s.mains.length}개 제품 · 마모 ${f3(s.wear)}%</span></div>` +
    s.mains.map(m=>
      `<div class="item ${SALES_SEL===m.main?'on':''}" onclick="pickProduct('${m.main}')">

    ).join('');

  $('main').innerHTML = `
    ${pageHead('영업관리', '생산량 기준 공구 소모 — 왼쪽에서 제품을 고르면 그 제품만 봅니다')}
    <div class="cards">
      ${cardHtml('누적 생산', num(s.parts),'개')}
      ${cardHtml('누적 마모', f3(s.wear),'%')}
      ${cardHtml('1,000개당', f4(s.per_1000),'%')}
    </div>
    <div class="grid2">
      <div class="panel">
        <h4>수주량별 공구 소모 예측</h4>
        <table><thead><tr><th class="n">생산 수량</th><th class="n">예상 마모</th><th class="n">소요 일수</th></tr></thead><tbody>
        ${s.capacity.map(c=>`<tr><td class="n">${num(c.qty)}개</td><td class="n">${f2(c.wear)}%</td>
          <td class="n">${f2(c.days)}일</td></tr>`).join('')}

      </div>
      <div class="panel">
        <h4>제품별 공구 소모 비중</h4>
        <div style="font-size:11.5px;color:var(--muted);margin-bottom:10px">
          줄을 누르면 그 제품만 봅니다.</div>
        <table><thead><tr><th>제품</th><th class="n">절삭(h)</th><th class="n">마모</th><th style="width:140px">비중</th></tr></thead><tbody>
        ${s.mains.map(m=>`<tr style="cursor:pointer" onclick="pickProduct('${m.main}')">
          <td><b>${nameOf(m)}</b><span class="muted"> · 하위 ${m.progs}개 · 공구 ${m.tools.length}종</span></td>
          <td class="n">${f2(m.hours)}</td><td class="n">${f3(m.wear)}%</td><td>${bar(m.share)}</td></tr>`).join('')}
        </tbody></table>

    <div class="panel">
      <h4>일별 생산량 · 공구 소모</h4>
      <table><thead><tr><th>일자</th><th class="n">절삭(h)</th><th class="n">생산량</th><th class="n">마모</th>
        <th class="n">개당 마모</th></tr></thead><tbody>
      ${s.days.map(d=>`<tr class="${d.cut_h>0?'':'muted'}"><td>${d.date}</td><td class="n">${f2(d.cut_h)}</td>
        <td class="n">${num(d.parts)}</td><td class="n">${f4(d.wear)}%</td>
